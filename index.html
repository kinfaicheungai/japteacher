async function chatJSON(sys,user,temp){
  if(!KEY)throw new Error("OpenAI Key が未設定です");
  const r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+KEY},
    body:JSON.stringify({model:"gpt-4o-mini",temperature:temp==null?0.7:temp,response_format:{type:"json_object"},messages:[{role:"system",content:sys},{role:"user",content:user}]})});
  if(!r.ok){let m="";try{m=(await r.json()).error.message}catch(e){}
    if(r.status===401)throw new Error("Key が無効です（401）");
    if(r.status===429)throw new Error(/quota|billing/i.test(m)?"クレジットが足りません":"リクエストが多すぎます。少し待ってください");
    throw new Error("エラー "+r.status);}
  return JSON.parse((await r.json()).choices[0].message.content);
}
const SPK=["F","M","F2","M2"];
async function genQuestion(words){
  const lvDesc={N3:"N3（日常会話中心、文は短め）",N2:"N2（職場・ニュース風も含む、やや自然な速さ）",N1:"N1（抽象的な話題や専門的な内容も含む）"}[curLv];
  const list=words.map(w=>`・${w.w}（${w.zh||""}）${w.ctx?"　前に出てきた文：「"+w.ctx.slice(0,60)+"」":""}`).join("\n");
  const sys="あなたはJLPT聴解の問題作成者です。日本語学習者（広東語話者）のために、苦手な語を新しい場面で自然に使った聞き取り問題を作ります。JSONのみ返します。";
  const usr=`レベル：${lvDesc}\n目標語：\n${list}\n\n条件：\n- 目標語を、前に出てきた場面とは違う新しい場面で、会話の中に自然に入れる（活用してもよい）。\n- 会話は4〜6行、現代の自然な話し言葉。話者記号は F, M, F2, M2 のいずれか。\n- 質問は、目標語の意味がわからないと答えにくい内容にする。ただし「この語の意味は？」とは聞かない。\n- 選択肢は4つ、正解は1つ、紛らわしい誤答を含める。\n\nJSON形式：\n{"intro":"場面の説明1文（例：会社で、女の人と男の人が話しています。）","lines":[["F","…"],["M","…"]],"ask":"質問文","opts":["…","…","…","…"],"ans":0,"exp":"繁體中文の解説（なぜその答えか、目標語の意味にも触れる）","vocab":[{"w":"目標語","reading":"ひらがな","zh":"中文","ex":"この問題とは別の例文","exzh":"中文翻譯"}]}`;
  const d=await chatJSON(sys,usr,0.8);
  if(!d||!Array.isArray(d.lines)||d.lines.length<3||!Array.isArray(d.opts)||d.opts.length<3||!Number.isInteger(d.ans)||d.ans<0||d.ans>=d.opts.length||!d.ask||!d.intro)throw new Error("bad");
  if(!d.lines.every(l=>Array.isArray(l)&&SPK.includes(l[0])&&typeof l[1]==="string"))throw new Error("bad");
  const id="gen-"+Date.now()+"-"+Math.random().toString(36).slice(2,6);
  V[id]=(d.vocab||[]).map(v=>[v.w,v.reading||"",v.zh||"",v.ex||"",v.exzh||""]);
  return {id,lv:curLv,type:"point",gen:true,targets:words.map(w=>w.w),intro:d.intro,lines:d.lines,ask:d.ask,opts:d.opts.map(String),ans:d.ans,exp:d.exp||""};
}
async function startTraining(){
  if(!KEY){toast("OpenAI Key が必要です");return}
  kick();
  app.innerHTML=`<div class="dk" style="text-align:center;padding:90px 20px"><div style="font-size:44px">🎓</div><h2 style="margin:10px 0">先生が今日の問題を作っています…</h2><small style="color:var(--mute)">あなたの苦手な語を、新しい場面で出題します</small></div>`;
  const due=wsDue().slice(0,6),gens=[];
  if(due.length){
    const groups=[];for(let i=0;i<due.length&&groups.length<3;i+=2)groups.push(due.slice(i,i+2));
    const res=await Promise.all(groups.map(g=>genQuestion(g).catch(()=>null)));
    res.forEach(r=>{if(r)gens.push(r)});
  }
  const wt=weakType(curLv);
  let pool0=wt?Q.filter(q=>q.lv===curLv&&q.type===wt):Q.filter(q=>q.lv===curLv);
  const wf=pool0.filter(q=>S.wrong.includes(q.id)),rest=shuffle(pool0.filter(q=>!S.wrong.includes(q.id)));
  const need=Math.max(3,6-gens.length);
  let bank=wf.concat(rest).slice(0,need);
  if(bank.length<need)bank=bank.concat(shuffle(Q.filter(q=>q.lv===curLv&&!bank.includes(q))).slice(0,need-bank.length));
  if(!gens.length&&due.length)toast("先生の問題作成に失敗しました。ステージ問題で練習します",4000);
  startRun("train",shuffle(gens.concat(bank)),5,"今日の特訓");
}

const spNorm=s=>String(s||"").replace(/[\s、。，．,.!！?？「」『』（）()…～~・\-—ー]/g,"").toLowerCase();
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const simScore=(a,b)=>{a=spNorm(a);b=spNorm(b);if(!a&&!b)return 100;return Math.max(0,Math.round((1-lev(a,b)/Math.max(a.length,b.length))*100))};

async function spPlay(slow){
  const it=sp.items[sp.i];if(!it)return;
  kick();const my=++playToken;stopSrc();
  const old=S.set.slow;if(slow)S.set.slow=true;
  try{
    const parts=sp.k==="fl"?it.lines.map(l=>({v:l[0],t:l[1],gap:0.6})):[{v:spVoice(it),t:it.jp,gap:0}];
    await playParts(parts,sp.lv,my);
  }catch(e){toast(e.message==="NEEDGESTURE"?"もう一度タップしてください":e.message,4000)}
  finally{S.set.slow=old}
}
async function spRecToggle(){
  if(mr&&mr.state==="recording"){mr.stop();return}
  if(sp.state==="busy")return;
  playToken++;stopSrc();
  try{
    mrStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  }catch(e){toast("マイクの許可が必要です（ブラウザの設定を確認してください）",5000);return}
  const types=["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg"];
  mrMime=types.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||"";
  mrChunks=[];
  mr=mrMime?new MediaRecorder(mrStream,{mimeType:mrMime}):new MediaRecorder(mrStream);
  mr.ondataavailable=e=>{if(e.data&&e.data.size)mrChunks.push(e.data)};
  mr.onstop=()=>{clearTimeout(mrTimer);mrStream.getTracks().forEach(t=>t.stop());const type=mr.mimeType||mrMime||"audio/webm";spProcess(new Blob(mrChunks,{type}),type)};
  mr.start();sp.state="rec";
  const b=$("#recbtn");if(b){b.textContent="⏹ 話し終わったらタップ";b.classList.add("recing")}
  const s=$("#spstat");if(s)s.textContent="🔴 録音中… （15秒で自動停止）";
  mrTimer=setTimeout(()=>{if(mr&&mr.state==="recording")mr.stop()},15000);
}
async function transcribe(blob,type){
  const ext=type.includes("mp4")?"m4a":type.includes("ogg")?"ogg":"webm";
  const fd=new FormData();
  fd.append("file",new File([blob],"speech."+ext,{type}));
  fd.append("model","whisper-1");fd.append("language","ja");fd.append("temperature","0");
  fd.append("prompt","日本語の短い会話です。");
  const r=await fetch("https://api.openai.com/v1/audio/transcriptions",{method:"POST",headers:{Authorization:"Bearer "+KEY},body:fd});
  if(!r.ok){let m="";try{m=(await r.json()).error.message}catch(e){}
    if(r.status===401)throw new Error("Key が無効です（401）");
    if(r.status===429)throw new Error(/quota|billing/i.test(m)?"クレジットが足りません":"リクエストが多すぎます");
    throw new Error("認識エラー "+r.status);}
  return (await r.json()).text||"";
}

  if(sp.k==="sh"){
    if(spNorm(heard)===spNorm(it.jp))return {score:100,feedback:"完璧です！お手本と同じ内容が認識されました。",diffs:[]};
    const sys="あなたは日本語の発音・口語練習を見る、優しく具体的な先生です。JSONのみ返します。繁體中文で書いてください。";
    const usr=`学習者がお手本を聞いてまねして言いました。音声認識(Whisper)の結果と比べて評価してください。\nお手本：${it.jp}\n認識結果：${heard}\n\n注意：認識結果は機械の聞き取りなので、漢字・かな表記や句読点の違い、同じ読みの別表記は一致とみなす。内容の抜け・言い間違い・語の置き換えを見る。機械の誤認識の可能性もあるので、断定せず穏やかに。\nJSON：{"score":0〜100の整数,"feedback":"短い講評（中文）","diffs":[{"expected":"お手本の語句","heard":"認識された語句","tip":"言い方のコツ（中文）"}]}\ndiffs は最大3つ。`;
    return await chatJSON(sys,usr,0.2);
  }
  const sys="あなたは日本語会話の先生です。学習者の発話の内容・自然さ・場面への合い方を評価します。JSONのみ返します。繁體中文で、優しく具体的に。";
  const usr=`会話：\n${it.lines.map(l=>l[0]+"："+l[1]).join("\n")}\n学習者がすべきこと：${it.task}\n模範解答：${it.ans}\n他の許容例：${(it.alts||[]).join(" / ")}\n学習者の発話（音声認識）：${heard}\n\n評価の基準：意味が場面に合っているか（最重要）、文法・語彙、自然さ、丁寧さ（場面：${it.reg}）。模範解答と違っても、自然で適切なら高く評価する。音声認識の誤りの可能性があるので断定しない。\nJSON：{"score":0〜100の整数,"verdict":"◎自然|○通じる|△不自然|×場面に合わない","feedback":"講評（中文、2〜3文）","better":"より自然な言い方があれば（日本語1文、なければ空）"}`;
  return await chatJSON(sys,usr,0.2);
}
async function spProcess(blob,type){
  sp.state="busy";const my=sp.i;
  const s=$("#spstat"),b=$("#recbtn");if(b){b.classList.remove("recing");b.textContent="🎤 録音して話す"}
  if(blob.size<3000){sp.state="idle";if(s)s.textContent="録音が短すぎます。もう一度どうぞ。";return}
  if(s)s.textContent="📝 認識しています…";
  const it=sp.items[sp.i];
  try{
    let heard=(await transcribe(blob,type)).trim();
    if(!spNorm(heard)||(HALLU.test(heard)&&!HALLU.test(it.jp||it.ans))){sp.state="idle";if(s)s.textContent="声がうまく認識できませんでした。静かな場所で、少し近づいてもう一度どうぞ。";return}
    if(s)s.textContent="🎓 先生が聞いています…";
    let j;
    try{j=await judgeSpeech(it,heard)}
    catch(e){if(sp.k==="sh")j={score:simScore(heard,it.jp),feedback:"（AI評価に接続できなかったため、文字の一致度で採点しました）",diffs:[]};else throw e}
    j.score=Math.max(0,Math.min(100,Math.round(j.score||0)));
    if(sp.i!==my)return;
    const prev=sp.res[sp.i];
    sp.last={i:sp.i,heard,j};
    const gain=j.score>=80?10:j.score>=60?5:2;
    if(prev==null){sp.xp+=gain;S.xp+=gain;const st=S.sstat[sp.k]||(S.sstat[sp.k]={n:0,sum:0});st.n++;st.sum+=j.score}
    if(prev==null||j.score>prev)sp.res[sp.i]=j.score;
    const rec=S.sp[it.id]||(S.sp[it.id]={best:0,tries:0});rec.tries++;rec.best=Math.max(rec.best,j.score);
    save();sp.state="done";
    renderSpeak();
  }catch(e){sp.state="idle";if(s)s.textContent="⚠ "+e.message}
}
function showSpeakResult(o){
  const it=sp.items[sp.i],j=o.j,fill=sp.k==="fl",last=sp.i>=sp.items.length-1;
  const col=j.score>=80?"var(--mint)":j.score>=60?"var(--gold)":"var(--verm)";
  const f=$("#spfb");if(!f)return;
  f.innerHTML=`<div class="fb ${j.score>=80?"ok":j.score>=60?"":"ng"}">
    <div class="fbh" style="color:${col}">${j.verdict?esc(j.verdict)+"　":""}${j.score}<small style="color:var(--mute)"> / 100</small></div>
    <div class="nt" style="margin:6px 0"><b>認識された内容：</b>${esc(o.heard)}</div>
    <div class="exp">🎓 ${esc(j.feedback||"")}</div>
    ${(j.diffs&&j.diffs.length)?j.diffs.map(d=>`<div class="tnote">「${esc(d.expected||"")}」→ 認識：「${esc(d.heard||"")}」<br>${esc(d.tip||"")}</div>`).join(""):""}
    ${j.better?`<div class="tnote">💬 より自然な言い方：<br>${tapWrap(j.better)} ${sayBtn(j.better)}</div>`:""}
    <div class="script"><div class="sl"><i class="n">${fill?"模範":"原文"}</i><span>${tapWrap(fill?it.ans:it.jp)}</span>${sayBtn(fill?it.ans:it.jp)}</div><div class="sl"><i class="m">中文</i><span>${esc(it.zh)}</span></div></div>
    ${it.note?`<div class="nt">💡 ${esc(it.note)}</div>`:""}
    <p class="tip" style="margin-top:8px">※ 点数は「機械がどれだけ正しく聞き取れたか」を基準にした目安で、発音そのもの（アクセントや音の長さ）の採点ではありません。</p>
    <div class="fbb"><button class="btn ghost" data-act="spagain">🎤 もう一度</button><button class="btn" data-act="spnext">${last?"結果へ":"次へ"} ▶</button></div></div>`;
  f.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function spNext(){
  playToken++;stopSrc();
  if(sp.i>=sp.items.length-1)return finishSpeak();
  sp.i++;sp.state="idle";sp.last=null;renderSpeak();window.scrollTo(0,0);
}
function finishSpeak(){
  const done=sp.res.filter(x=>x!=null),avg=done.length?Math.round(done.reduce((a,b)=>a+b,0)/done.length):0;
  const bonus=15;S.xp+=bonus;save();
  const L=LEVELS[sp.lv];
  app.innerHTML=`<div class="res" style="--ac:${L.color}"><div class="big">${avg>=80?"🎤✨":avg>=60?"🎤":"💪"}</div><h2>${avg>=80?"すばらしい！":avg>=60?"いい調子！":"よく頑張りました"}</h2><small>${sp.k==="sh"?"まねして言う":"場面で答える"} ・ ${sp.lv}</small>
   <div class="stat"><div><b>${avg}</b><small>平均</small></div><div><b>${done.filter(x=>x>=80).length}/${sp.items.length}</b><small>80点以上</small></div><div><b>+${sp.xp+bonus}</b><small>XP</small></div></div>
   <button class="btn block" data-act="spstart" data-k="${sp.k}">↻ もう一度（苦手なものから）</button><button class="btn ghost block" data-act="home">ホームへ</button></div>`;
  window.scrollTo(0,0);
}

/* ---------- 事件 ---------- */
const H={
  spstart(el){startSpeak(el.dataset.k)},
  spplay(){spPlay(false)},
  spslow(){spPlay(true)},
  sphide(){sp.hide=!sp.hide;renderSpeak()},
  sprec(){spRecToggle()},
  spagain(){sp.last=null;sp.state="idle";renderSpeak()},
  spnext(){spNext()},
  spquit(){if(confirm("練習を終わりますか？")){playToken++;stopSrc();if(mr&&mr.state==="recording"){mr.onstop=null;try{mr.stop()}catch(e){}if(mrStream)mrStream.getTracks().forEach(t=>t.stop())}sp=null;renderHome()}},
  train(){startTraining()},
  report(){openReport()},
  dknow(el){const x=S.wst[el.dataset.w];if(x){x.box=5;x.due=Date.now()+IVL[5]*DAY;save()}toast("了解！もう出題しません 👍");},
  word(el){openDict("w",el.dataset.w,el.dataset.c||"")},
  sent(el){openDict("s",el.dataset.c,"")},
  dclose(){closeDict()},
  dsave(el){
    S.words=S.words||[];const w=el.dataset.w,i=S.words.findIndex(x=>x.w===w);
    if(i>=0){S.words.splice(i,1);el.textContent="☆ 単語帳に保存"}
    else{S.words.push({w,reading:el.dataset.r,zh:el.dataset.z,jlpt:el.dataset.l});el.textContent="★ 保存済み"}
    save();
  },
  words(){openWordList()},
  wopen(el){openDict("w",el.dataset.w,"")},
  wdel(el){S.words.splice(+el.dataset.i,1);save();openWordList()},
  say(el){kick();const my=++playToken;stopSrc();playParts([{v:"F",t:el.dataset.t,gap:0}],curLv,my).catch(e=>toast(e.message==="NEEDGESTURE"?"もう一度タップしてください":e.message,4000))},
  start(){const v=$("#keyin").value.trim();if(!v.startsWith("sk-")){toast("OpenAI Key は sk- で始まります");return}KEY=v;LS.set("jq_key",KEY);touchDay();kick();renderHome()},
  lv(el){curLv=el.dataset.lv;LS.set("jq_lv",curLv);renderHome()},
  stage(el){kick();startStage(el.dataset.id)},
  review(){kick();startReview()},
  settings(){openSheet()},
  closeSheet(){closeSheet()},
  set(el){const k=el.dataset.k;let v=el.dataset.v;if(v==="true")v=true;else if(v==="false")v=false;S.set[k]=v;save();closeSheet();openSheet()},
  rekey(){closeSheet();renderSetup()},
  async testaudio(){
    kick();toast("音聲を生成しています…",6000);const my=++playToken;
    try{await playParts([{v:"F",t:"こんにちは。聴解クエストへようこそ。",gap:0.5},{v:"M",t:"音聲は聞こえますか。",gap:0.3}],"N3",my);toast("🔊 テスト完了。聞こえましたか？")}
    catch(e){toast(e.message==="NEEDGESTURE"?"ブラウザが音聲をブロックしました。もう一度タップしてください":e.message,5000)}
  },
  reset(){if(confirm("星・XP・復習ノートをすべてリセットしますか？")){S=fresh();save();closeSheet();touchDay();renderHome()}},
  quit(){if(confirm("中断しますか？（この回の進行は保存されません）")){playToken++;stopSrc();run=null;renderHome()}},
  play(){
    const qi=run.qs[run.i];
    if(audioState==="playing"){playToken++;stopSrc();setAudio("done");return}
    playQ(qi);
  },
  ans(el){answer(+el.dataset.i)},
  next(){nextQ()},
  replay(){const my=++playToken;kick();stopSrc();const qi=run.qs[run.i];playParts(qi.parts,run.lv,my,()=>setAudio("playing")).then(f=>{if(f&&my===playToken)setAudio("done")}).catch(e=>{if(my===playToken)setAudio(e.message==="NEEDGESTURE"?"gesture":"error",e.message)})},
  retry(){if(run.id==="review")startReview();else if(run.id==="train")startTraining();else startStage(run.id)},
  nextstage(){const n=nextStageOf(run.id);if(n)startStage(n.id);else renderHome()},
  home(){run=null;renderHome()}
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const f=H[el.dataset.act];if(f)f(el,e)});

/* ---------- 起動 ---------- */
if(KEY){touchDay();renderHome()}else renderSetup();
</script>
