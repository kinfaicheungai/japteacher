<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1226">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>聴解クエスト</title>
<meta name="apple-mobile-web-app-title" content="聴解クエスト">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1226; --bg2:#151b38; --card:#1b2246; --card2:#232b57; --line:#2f3868;
  --gold:#f2c14e; --verm:#ef5b45; --sakura:#f4a6c0; --ice:#9fd3ff; --mint:#74e0b2;
  --text:#f3efe6; --mute:#9aa3c7; --ac:#f4a6c0;
  --serif:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  --sans:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP','PingFang TC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--sans);color:var(--text);background:var(--bg);
  background-image:
    radial-gradient(1px 1px at 20% 15%,#fff8 50%,transparent 51%),
    radial-gradient(1px 1px at 70% 8%,#fff6 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 85% 30%,#fff7 50%,transparent 51%),
    radial-gradient(1px 1px at 40% 40%,#fff5 50%,transparent 51%),
    radial-gradient(ellipse at 50% -10%,#2b3570 0%,transparent 60%);
  background-attachment:fixed;
  -webkit-text-size-adjust:100%;
}
#app{max-width:520px;margin:0 auto;min-height:100dvh;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 20px;border-radius:14px;background:var(--gold);color:#241a05;font-weight:700;font-size:15px;box-shadow:0 4px 0 #b88a1d;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b88a1d}
.btn.ghost{background:var(--card2);color:var(--text);box-shadow:0 4px 0 #141a3a}
.btn.ghost:active{box-shadow:0 1px 0 #141a3a}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
h1,h2,h3{font-family:var(--serif)}
small{color:var(--mute)}

/* setup */
.setup{padding-top:9vh;text-align:center}
.logo{font-family:var(--serif);font-weight:800;font-size:44px;letter-spacing:.06em;line-height:1.1}
.logo b{color:var(--ac);font-weight:800}
.tag{color:var(--mute);font-size:12px;letter-spacing:.3em;margin:8px 0 28px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;text-align:left}
.panel label{display:block;font-size:12px;color:var(--mute);letter-spacing:.08em;margin-bottom:6px}
.inp{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;font-family:ui-monospace,Menlo,monospace;outline:none}
.inp:focus{border-color:var(--gold)}
.hint{font-size:12px;color:var(--mute);line-height:1.7;margin:8px 0 16px}
.hint a{color:var(--gold)}

/* home */
.hd{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
.brand{font-family:var(--serif);font-weight:800;font-size:22px;letter-spacing:.05em}
.brand b{color:var(--ac)}
.chips{display:flex;gap:6px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700}
.rank{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.rank .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.rank .row b{font-family:var(--serif);font-size:17px}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--verm));border-radius:99px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tab{padding:11px 0;border-radius:14px;background:var(--card);border:2px solid var(--line);font-family:var(--serif);font-weight:800;font-size:18px;color:var(--mute)}
.tab.on{border-color:var(--ac);color:var(--ac);background:var(--card2)}
.world{position:relative;border-radius:20px;overflow:hidden;height:140px;margin-bottom:16px;border:1px solid var(--line);background:var(--card)}
.world svg,.world img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.world .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 16px 10px;background:linear-gradient(transparent,#0b0f24e6)}
.world .cap h2{font-size:24px;letter-spacing:.06em}
.world .cap small{color:#d6dbf5}
.path{display:flex;flex-direction:column;gap:10px;position:relative}
.stage{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:left;width:100%;transition:transform .08s}
.stage:active{transform:scale(.985)}
.stage .node{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--bg);border:2px solid var(--ac)}
.stage .si{flex:1;min-width:0}
.stage .si b{display:block;font-family:var(--serif);font-size:17px}
.stage .si small{font-size:12px}
.stage .st{font-size:16px;letter-spacing:2px;color:var(--gold);white-space:nowrap}
.stage.boss{background:linear-gradient(135deg,#3a1b2c,#2b1f4a);border-color:var(--verm)}
.stage.boss .node{border-color:var(--verm);background:#2a0f1a}
.stage.done .node{background:var(--ac);color:#1a1230}
.sub{display:flex;gap:10px;margin-top:16px}
.sub .btn{flex:1;font-size:14px}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px;padding:14px 0 8px}
.x{width:36px;height:36px;border-radius:50%;background:var(--card);font-size:16px}
.dots{flex:1;display:flex;gap:4px}
.dots i{flex:1;height:8px;border-radius:99px;background:var(--card2)}
.dots i.ok{background:var(--mint)} .dots i.ng{background:var(--verm)} .dots i.cur{background:var(--gold)}
.hearts{font-size:15px;letter-spacing:1px;white-space:nowrap}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;text-align:center;margin-top:6px}
.qtype{display:inline-block;padding:4px 12px;border-radius:99px;background:var(--bg);font-size:13px;font-weight:700;margin-bottom:12px}
.qtype small{margin-left:6px}
.sit{font-size:15px;line-height:1.8;margin:2px 0 12px;padding:10px 12px;background:var(--bg);border-radius:12px;text-align:left}
.pbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:18px;background:var(--ac);color:#1a1230;font-weight:800;font-size:17px;box-shadow:0 5px 0 #0003}
.pbtn:active{transform:translateY(3px)}
.pbtn[disabled]{opacity:.55;pointer-events:none}
.wave{display:flex;gap:4px;justify-content:center;align-items:center;height:30px;margin:12px 0 4px}
.wave i{width:5px;height:8px;border-radius:3px;background:var(--mute);opacity:.5}
.wave.on i{background:var(--ac);opacity:1;animation:wv .9s ease-in-out infinite}
.wave.on i:nth-child(2n){animation-delay:.15s}.wave.on i:nth-child(3n){animation-delay:.3s}.wave.on i:nth-child(5n){animation-delay:.45s}
@keyframes wv{0%,100%{height:6px}50%{height:28px}}
.astat{font-size:13px;color:var(--mute);min-height:20px}
.astat.err{color:#ff9d8f}
.qtext{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:15px;line-height:1.7;text-align:left}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--card);border:2px solid var(--line);text-align:left;font-size:16px;line-height:1.5;transition:transform .08s}
.opt:active{transform:scale(.985)}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-family:var(--serif);font-size:15px}
.opt.ok{border-color:var(--mint);background:#143a37}
.opt.ng{border-color:var(--verm);background:#40182a}
.opt.dim{opacity:.55}
.opt.lock{pointer-events:none}
.fb{margin-top:16px;border-radius:20px;padding:16px;border:1px solid var(--line);background:var(--card);animation:up .25s ease}
.fb.ok{border-color:var(--mint)} .fb.ng{border-color:var(--verm)}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.fbh{font-family:var(--serif);font-weight:800;font-size:20px}
.fba{margin:6px 0 10px;font-size:15px}
.script{background:var(--bg);border-radius:14px;padding:10px 12px;margin:8px 0;font-size:14px;line-height:1.75}
.sl{display:flex;gap:8px;align-items:baseline;margin:3px 0}
.sl i{flex:none;font-style:normal;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;min-width:34px;text-align:center}
.sl i.f{background:#5a2b4a;color:#ffc6de} .sl i.m{background:#23406b;color:#bfe0ff} .sl i.n{background:#3d3a2a;color:#ffe9a8}
.qimg{margin:10px 0 4px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--bg);line-height:0}
.qimg img{width:100%;height:auto;display:block;aspect-ratio:4/3;object-fit:cover;background:var(--card)}
.qimg small{display:block;line-height:1.4;padding:6px 10px;font-size:11px;color:var(--mute);text-align:left}
.vocab{margin:10px 0 12px}
.vocab h4{font-size:13px;color:var(--gold);margin:0 0 6px;letter-spacing:.06em}
.vc{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:6px 0}
.vc .w{font-family:var(--serif);font-size:17px;font-weight:700}
.vc .w rt,.vc .w small{font-size:12px;color:var(--mute);font-weight:400;margin-left:6px}
.vc .m{font-size:14px;color:var(--mint);margin:2px 0}
.vc .e{font-size:13.5px;line-height:1.6;color:#dfe3f7}
.vc .e i{display:block;font-style:normal;color:var(--mute);font-size:12.5px}
.tw{border-bottom:1px dotted var(--mute);cursor:pointer;border-radius:3px}
.tw:active{background:#f2c14e33}
.sb{margin-left:auto;flex:none;font-size:11px;font-weight:700;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:1px 7px;cursor:pointer}
.dk .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dk .big{font-family:var(--serif);font-size:30px;font-weight:700}
.dk .rd{color:var(--mute);font-size:15px}
.dk .lv{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--gold);color:#1a1530}
.dk .pos{font-size:12px;color:var(--mute)}
.dk .zh{font-size:17px;color:var(--mint);margin:8px 0 2px;font-weight:700}
.dk .ja{font-size:14px;line-height:1.7;color:#dfe3f7;margin:2px 0 10px}
.dk h4{font-size:13px;color:var(--gold);margin:12px 0 4px;letter-spacing:.06em}
.dk .us{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:9px 12px;margin:6px 0;font-size:14px;line-height:1.65}
.dk .us small{display:inline-block;background:var(--card);border-radius:6px;padding:0 7px;color:var(--gold);font-size:11.5px;margin-bottom:2px}
.dk .us i{display:block;font-style:normal;color:var(--mute);font-size:12.5px}
.dk .nt{font-size:13.5px;line-height:1.7;color:#dfe3f7}
.dk .acts{display:flex;gap:8px;margin-top:14px}
.dk .acts .btn{flex:1;padding:10px 8px;font-size:14px}
.dk .load{padding:30px 0;text-align:center;color:var(--mute)}
.dk .wrow{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:9px 0}
.dk .wrow .t{flex:1;cursor:pointer}
.dk .wrow .t b{font-family:var(--serif);font-size:17px}
.dk .wrow .t small{display:block;color:var(--mute);font-size:12.5px}
.coach{background:linear-gradient(135deg,#2a2150,#1c2a4d);border:1px solid var(--gold);border-radius:18px;padding:12px 14px;margin:0 0 12px}
.coach .r1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.coach b{font-size:16px}
.coach small{display:block;color:var(--mute);font-size:12.5px;line-height:1.5;margin-top:2px}
.coach .btn{padding:9px 14px;font-size:14px;flex:none}
.coach .lnk{font-size:12.5px;color:var(--gold);margin-top:8px;display:inline-block;cursor:pointer;text-decoration:underline}
.tnote{background:#f2c14e14;border:1px solid #f2c14e55;border-radius:12px;padding:8px 12px;font-size:13px;line-height:1.7;margin:8px 0}
.rep .bar2{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin:3px 0 8px}
.rep .bar2 i{display:block;height:100%;background:var(--ac,var(--gold))}
.jpbig{font-family:var(--serif);font-size:22px;line-height:1.8;margin:12px 0 6px;font-weight:700}
.jpbig.hid{filter:blur(9px);user-select:none}
@keyframes recpulse{0%,100%{box-shadow:0 0 0 0 #ef5b4588}50%{box-shadow:0 0 0 14px #ef5b4500}}
.recing{animation:recpulse 1.1s infinite}
.ver{font-size:11px;font-weight:700;color:var(--mute);margin-left:8px;letter-spacing:.04em;vertical-align:middle;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.ver2{color:var(--gold);font-weight:700}
.exp{font-size:14px;line-height:1.75;color:#dfe3f7;margin:8px 0 14px}
.fbb{display:flex;gap:10px}.fbb .btn{flex:1;font-size:14px;padding:12px 8px}

/* result */
.res{text-align:center;padding-top:8vh}
.res .big{font-size:56px;letter-spacing:6px;color:var(--gold)}
.res h2{font-size:30px;margin:8px 0}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px}
.stat b{display:block;font-family:var(--serif);font-size:22px}
.stat small{font-size:11px}
.res .btn{margin-top:10px}

/* sheet */
.sheet{position:fixed;inset:0;background:#05081acc;display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet .in{width:100%;max-width:520px;max-height:88dvh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}
.sheet h3{font-size:20px;margin-bottom:12px}
.row2{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.row2 small{display:block;font-size:12px;margin-top:2px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:2px;flex:none}
.seg button{padding:7px 12px;border-radius:9px;font-size:13px;color:var(--mute);font-weight:700}
.seg button.on{background:var(--gold);color:#241a05}
.tip{font-size:12px;color:var(--mute);line-height:1.7;margin-top:12px}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-90px);background:#000d;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:13px;z-index:99;transition:transform .25s;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
</style>
</head>

1z4.cloudfront.net/user_2yU7iiYEbc59mRGsiqQI4GbrdCv/hf_20261107_133315_dcd4f2b6-0766-45c4-9818-93a80ebd56e2.png",lecture:"https://d8j0ntlcm91z4.cloudfront.net/user_2yU7iiYEbc59mRGsiqQI4GbrdCv/hf_20261107_133314_3efa31ca-e756-4cd4-989d-07c944e9f1b4.png",cityhall:"https://d8j0ntlcm91z4.cloudfront.net/user_2yU7iiYEbc59mRGsiqQI4GbrdCv/hf_20261107_133315_64a9cfb1-1c5b-4b18-946d-2a3d251f3b49.png"};
const V={},IM={};const vo=(id,a)=>{V[id]=a};const im=(id,k,pos)=>{IM[id]={k,pos}};

/* ===== N3 ===== */
add("N3","quick",{lines:[["M","すみません、この席、空いていますか。"]],rv:"F",opts:["ええ、どうぞ。","はい、ここにいました。","いいえ、空いていました。"],ans:0,exp:"「空いていますか」是問座位有沒有人，自然的回答是「ええ、どうぞ」。其他選項的時態和意思都不對。"});
add("N3","quick",{lines:[["F","お先に失礼します。"]],rv:"M",opts:["お疲れさまでした。","いらっしゃいませ。","お待たせしました。"],ans:0,exp:"「お先に失礼します」是比同事早下班時說的話，對方會回「お疲れさまでした」。"});
add("N3","quick",{lines:[["M","資料、明日までに送ってもらえませんか。"]],rv:"F",opts:["はい、今日中にお送りします。","いえ、もらえませんでした。","ええ、送ってあげます。"],ans:0,exp:"「〜てもらえませんか」是禮貌的請求。「お送りします」是謙讓語，最自然；對請求你的人說「あげます」很失禮。"});
add("N3","quick",{lines:[["F","この間貸した本、もう読んだ？"]],rv:"M",opts:["ごめん、まだ読み終わってないんだ。","うん、貸してあげたよ。","ううん、読んでもらったよ。"],ans:0,exp:"對方問「もう読んだ？」，還沒讀完就說「まだ読み終わってない」。其他選項把借出／借入的關係弄反了。"});

add("N3","task",{intro:"会社で、女の人と男の人が話しています。",lines:[["F","田中さん、明日の会議の資料、もう準備できた？"],["M","はい、コピーは終わっています。あとは、会議室の予約だけです。"],["F","あ、会議室ならもう私が予約しておいたよ。それより、お客さんに送る案内メールが、まだじゃない？"],["M","あっ、そうでした。すぐ送ります。"]],ask:"男の人は、このあと、まず何をしますか。",opts:["資料をコピーする","会議室を予約する","お客さんにメールを送る","会議の資料を作る"],ans:2,exp:"資料影印「終わっています」；會議室女的說「予約しておいた」。還沒做的是給客人的通知郵件，所以「すぐ送ります」。"});
add("N3","task",{intro:"家で、お母さんと息子が話しています。",lines:[["F2","たけし、これから買い物に行くけど、何か必要なものある？"],["M2","うーん、牛乳がなくなりそうだったかな。あと、パンも。"],["F2","牛乳はまだ半分あるから大丈夫よ。パンは買ってくるね。"],["M2","じゃあ、ついでに卵も買ってきて。"],["F2","卵はこの前買ったでしょ。じゃあ、パンだけね。"]],ask:"お母さんは、何を買ってきますか。",opts:["牛乳とパン","パンと卵","パンだけ","牛乳だけ"],ans:2,exp:"牛奶還有一半、雞蛋前幾天買過，最後的結論是「パンだけ」。對話裡會有反覆，要聽到最後。"});
add("N3","task",{intro:"旅行の準備について、男の人と女の人が話しています。",lines:[["M","来週の旅行のホテル、予約しておいたよ。"],["F","ありがとう。電車の切符は？"],["M","それはまだ。ネットで予約できるって聞いたけど、やり方がわからなくて。"],["F","じゃあ、私がやっておくよ。パスワードを教えて。"],["M","ごめん、パスワードは忘れちゃった。先に再設定しないと…。"],["F","それなら、再設定は私がやるから、メールアドレスだけ教えて。"]],ask:"男の人は、このあと、まず何をしますか。",opts:["切符を予約する","パスワードを再設定する","ホテルを予約する","メールアドレスを教える"],ans:3,exp:"切符和密碼重設都由女的來做；男的只要做一件事：告訴她 e-mail 地址。"});
add("N3","task",{intro:"病院の受付で、受付の女の人と男の人が話しています。",lines:[["F","次の方、どうぞ。保険証はお持ちですか。"],["M","はい。あ、でも今日は持ってくるのを忘れてしまって…。"],["F","そうですか。では、今日は全額お支払いいただいて、後日、保険証を持ってきていただければ、お返しできますが…。"],["M","わかりました。家は近いので、取ってきます。"],["F","では、その前に、こちらの紙に症状を書いておいてください。"]],ask:"男の人は、まず何をしますか。",opts:["保険証を取りに帰る","紙に症状を書く","全額を支払う","医者に会う"],ans:1,exp:"「取ってきます」是之後的事；女的說「その前に」（在那之前）請他先寫症狀。「まず」要抓順序詞。"});

add("N3","point",{intro:"男の人と女の人が話しています。",lines:[["F","あれ、遅かったね。電車が遅れたの？"],["M","ううん、電車は時間どおりだったんだけど、駅に着いてから財布を忘れたことに気づいて、家まで取りに戻ったんだ。"],["F","それは大変だったね。"]],ask:"男の人は、どうして遅れましたか。",opts:["電車が遅れたから","財布を取りに戻ったから","道に迷ったから","寝坊したから"],ans:1,exp:"先否定「電車は時間どおり」，真正原因是忘了錢包回家拿。聽到「ううん」要小心被否定的選項。"});
add("N3","point",{intro:"ラーメン屋について、女の人と男の人が話しています。",lines:[["F","このラーメン屋、おすすめだよ。"],["M","へえ、有名なの？"],["F","有名っていうより、値段が安いのにスープがすごくおいしいんだ。ただ、昼は混んでるから、少し遅めに行くのがいいよ。"]],ask:"女の人がこのラーメン屋をすすめる理由は何ですか。",opts:["有名だから","安くておいしいから","空いているから","近いから"],ans:1,exp:"「有名っていうより」＝比起有名，更重要的是「便宜又好喝」。中午會擠，所以不是「空いている」。"});
add("N3","point",{intro:"会社で、女の人と男の人が話しています。",lines:[["F","山本さん、明日の午後の会議、出られそう？"],["M","それが、午前中の出張が長引きそうで、新幹線が着くのが三時なんです。会議は二時からですよね。"],["F","そうか。じゃあ、途中からになるね。"],["M","はい、できれば資料は先に送っておいてください。"]],ask:"男の人は、どうして会議に遅れますか。",opts:["新幹線が止まるから","出張が長引くから","資料を作るから","体調が悪いから"],ans:1,exp:"「出張が長引きそう」是原因，新幹線三點到只是結果。新幹線並沒有停駛。"});
add("N3","point",{intro:"不動産屋で、店の男の人とお客さんの女の人が話しています。",lines:[["M","ご希望の条件を教えてください。"],["F","駅から歩いて十分以内で、できれば二階以上がいいです。"],["M","広さはどのくらいで？"],["F","一人暮らしなので、狭くてもかまいません。ただ、ペットが飼えるところがいいんです。"]],ask:"女の人が、部屋について一番必要だと言っているのはどれですか。",opts:["駅から近いこと","二階以上であること","広いこと","ペットが飼えること"],ans:3,exp:"「できれば」是希望而已、「狭くてもかまいません」是不重要；「ただ、〜がいいんです」才是真正的重點條件。"});

add("N3","gist",{intro:"市の図書館の放送です。",lines:[["M","えー、来月から、駅前の市立図書館の利用時間が変わります。今までは夜八時まででしたが、来月からは夜九時まで利用できるようになります。ただし、日曜日は今までどおり、午後五時までです。ぜひ、ご利用ください。"]],ask:"何についての話ですか。",opts:["図書館の利用時間の変更","図書館の新しい本","日曜日の休み","駅前の工事"],ans:0,exp:"重點是圖書館「利用時間の変更」（延長到晚上九點，星期日不變）。"});
add("N3","gist",{intro:"女の人が話しています。",lines:[["F","私は子どものころから、人前で話すのが苦手でした。でも、大学で友達に誘われて、スピーチのサークルに入ってから、少しずつ平気になりました。今は、仕事で発表するのが楽しみなくらいです。"]],ask:"この人は、どんな話をしていますか。",opts:["話すのが上手になった経験","サークルをやめた理由","仕事が忙しいこと","友達との旅行"],ans:0,exp:"從不擅長說話，到現在期待上台發表——講的是「變得會說話的經驗」。"});
add("N3","gist",{intro:"ラジオで、天気予報を伝えています。",lines:[["M","明日は、朝のうちは晴れますが、午後から雲が広がり、夕方には雨になるでしょう。傘を持って出かけたほうがよさそうです。気温は今日より少し低くなります。"]],ask:"この話のポイントは何ですか。",opts:["一日中晴れること","午後から天気が悪くなること","気温が上がること","朝から雨が降ること"],ans:1,exp:"上午晴、「午後から」轉陰、傍晚下雨，所以要帶傘。氣溫是比今天低。"});
add("N3","gist",{intro:"二人が、週末の旅行について話しています。",lines:[["F","週末の旅行、どこにする？ 海か山か。"],["M","山は去年行ったから、今年は海がいいな。"],["F","でも、海は人が多いし、混むよ。"],["M","じゃあ、人が少ない小さな島はどう？"],["F","いいね、そこにしよう。"]],ask:"二人は、どこに行くことにしましたか。",opts:["去年行った山","人が多い海","人が少ない小さな島","近くの公園"],ans:2,exp:"先排除山（去年去過）和人多的海，最後決定「人が少ない小さな島」。"});

add("N3","utter",{ask:"友達の家に遊びに行きました。帰るとき、何と言いますか。",rv:"F",opts:["お邪魔しました。","いらっしゃいませ。","ただいま。"],ans:0,exp:"到朋友家作客離開時說「お邪魔しました」（打擾了）。「ただいま」是回自己家，「いらっしゃいませ」是接待客人的話。"});
add("N3","utter",{ask:"友達が、重い荷物を持って歩いています。手伝いたいとき、何と言いますか。",rv:"M",opts:["持ちましょうか。","持ってください。","持たせてもらいます。"],ans:0,exp:"主動提議幫忙用「〜ましょうか」（我來拿吧）。「持ってください」是請對方拿。"});
add("N3","utter",{ask:"店で買った服のサイズが合いません。店員に、もう少し大きいサイズに替えてもらいたいとき、何と言いますか。",rv:"F",opts:["すみません、これ、もう少し大きいのと替えていただけますか。","すみません、これ、もう少し大きいのを買ってあげますか。","すみません、これ、もう少し大きくなりますか。"],ans:0,exp:"「〜ていただけますか」是客氣地請對方替自己做事。其他兩項文法或意思不通。"});
add("N3","utter",{ask:"会議で、ほかの人の意見と少し違う考えがあります。自分の意見を言うとき、何と言いますか。",rv:"M",opts:["それはそうかもしれませんが、私は少し違うと思います。","それはぜんぜんだめです。","私の意見はどうでもいいです。"],ans:0,exp:"表達不同意見時，先說「それはそうかもしれませんが」再提出自己的看法，最委婉有禮。"});

/* ===== N2 ===== */
add("N2","quick",{lines:[["M","この企画、もう少し検討したほうがいいんじゃないかな。"]],rv:"F",opts:["そうですね。もう一度、見直してみます。","いいえ、検討はしませんでした。","はい、検討させられました。"],ans:0,exp:"「〜んじゃないかな」是委婉的建議。順著建議回答「見直してみます」最自然。"});
add("N2","quick",{lines:[["F","昨日の試合、見ましたか。"]],rv:"M",opts:["いえ、残業で見られなかったんです。","ええ、これから見るところです。","いえ、見ることになっていません。"],ans:0,exp:"「見られなかった」（沒能看到）配上原因「残業で」。「これから見る」時間不符，「見ることになっていません」意思不通。"});
add("N2","quick",{lines:[["M","すみません、この書類、今日中にお願いできないでしょうか。"]],rv:"F",opts:["承知しました。何とか間に合わせます。","ええ、今日中ではありませんでした。","お願いしないでください。"],ans:0,exp:"「〜できないでしょうか」是很客氣的請求。回答「承知しました」是接受委託。"});

add("N2","task",{intro:"会社で、女の人と部長が、出張の準備について話しています。",lines:[["F","部長、来週の出張なんですが、新幹線と飛行機、どちらにしましょうか。"],["M","うーん、飛行機のほうが早いけど、空港までが遠いからなあ。"],["F","そうですね。新幹線なら駅から会場まで歩けますし、料金もほぼ同じです。"],["M","じゃあ、新幹線にしよう。ただ、帰りは会議が長引くかもしれないから、帰りの切符は時間を決めずに取ってくれる？"],["F","わかりました。いつでも乗れる切符ですね。では、手配しておきます。"]],ask:"女の人は、このあと、まず何をしますか。",opts:["飛行機の予約をする","新幹線の往復の切符を手配する","会場までの道を調べる","部長に日程を確認する"],ans:1,exp:"交通方式已決定為新幹線，女的最後說「手配しておきます」。回程要買不指定時間的票。"});
add("N2","task",{intro:"大学で、先生と女の学生が話しています。",lines:[["F","先生、レポートの提出のことなんですが、締め切りを少し延ばしていただけませんか。"],["M","どうして？"],["F","実は、調査に協力してくれる予定だった会社から、急にお断りされてしまって。"],["M","それは困ったね。でも、延ばすのは一週間までだよ。他の会社を探すより、図書館の統計データを使うほうが早いんじゃないかな。"],["F","わかりました。じゃあ、まず先生がおっしゃったデータがあるか、図書館で確認してみます。"]],ask:"女の学生は、まず何をしますか。",opts:["別の会社に連絡する","図書館でデータを探す","レポートを書き始める","締め切りを延ばす手続きをする"],ans:1,exp:"老師建議用圖書館的統計資料比找新公司快，學生說「まず…図書館で確認してみます」。"});
add("N2","task",{intro:"電話で、お店の男の人とお客さんの女の人が話しています。",lines:[["M","お電話ありがとうございます。サポートセンターでございます。"],["F","あの、先週買った洗濯機が動かなくなってしまって。"],["M","電源は入りますか。"],["F","電源は入るんですけど、水が出ないんです。"],["M","蛇口は開いていますか。"],["F","あ、確認していませんでした。…あ、閉まっていました。でも、開けても水が出ないんです。"],["M","そうですか。では、お客様のお宅に伺って確認いたします。明日の午前と午後、どちらがよろしいですか。"],["F","午前は出かけるので、午後でお願いします。"],["M","かしこまりました。では、午後に伺います。お名前と住所をお願いできますか。"]],ask:"女の人は、このあと、何をしますか。",opts:["蛇口を確認する","午前の予定を変える","名前と住所を伝える","洗濯機の電源を入れる"],ans:2,exp:"水龍頭已經確認過了，時間也決定是下午。最後被要求的是「お名前と住所」。"});

add("N2","point",{intro:"男の人と女の人が、転職について話しています。",lines:[["F","転職、決めたんだって？"],["M","うん。給料は今の会社のほうがいいんだけど、新しい会社は残業がほとんどなくて、家族と過ごす時間が増えそうなんだ。"],["F","へえ。やりたい仕事だったから、じゃないんだ。"],["M","もちろん仕事も魅力だけど、決め手は家族との時間かな。"]],ask:"男の人が、新しい会社を選んだ一番の理由は何ですか。",opts:["給料が上がるから","やりたい仕事だから","家族との時間が増えるから","会社が家に近いから"],ans:2,exp:"薪水其實現在的公司比較高。「決め手は〜」（決定性因素）就是「家族との時間」。"});
add("N2","point",{intro:"二人が、レストランについて話しています。",lines:[["M","ここ、どう？ 初めて来たんでしょ？"],["F","料理はおいしいし、店の雰囲気もいいと思う。ただ、注文してから出てくるまでに、ちょっと時間がかかりすぎるかな。"],["M","確かに。昼休みだと困るよね。"]],ask:"女の人は、この店のどこに不満を持っていますか。",opts:["料理の味","店の雰囲気","料理が出るまでの時間","値段"],ans:2,exp:"先稱讚味道和氣氛，「ただ、〜」後面才是不滿：上菜時間太久。"});
add("N2","point",{intro:"店で、男の人と店員の女の人が話しています。",lines:[["M","先週ここで買ったこの掃除機なんですが、返品したいんです。"],["F","どこか、問題がございましたか。"],["M","壊れているわけじゃないんです。ただ、思っていたより音がうるさくて、夜は使えそうにないんですよ。"],["F","さようでございますか。"]],ask:"男の人が、この掃除機を返品したい理由は何ですか。",opts:["壊れていたから","値段が高かったから","音が大きかったから","サイズが大きかったから"],ans:2,exp:"「壊れているわけじゃない」先否定故障，真正理由是「音がうるさくて」。"});

add("N2","gist",{intro:"大学の授業で、先生が話しています。",lines:[["M","近年、都市部では、車を持たない若者が増えています。その背景には、公共交通機関が発達していることに加え、車の維持費が高いことがあります。また、必要なときだけ借りるカーシェアリングが普及したことも、大きな理由です。"]],ask:"この話の主なテーマは何ですか。",opts:["若者が車を持たなくなった背景","カーシェアリングの料金","公共交通機関の事故","車の新しい技術"],ans:0,exp:"整段在說「為什麼年輕人不再買車」的背景：交通發達、維持費高、共享汽車普及。"});
add("N2","gist",{intro:"会社で、女の人が話しています。",lines:[["F","今回のプロジェクトでは、私たちのチームは、期限には間に合いましたが、予算を大きく超えてしまいました。原因は、最初の見積もりが甘かったことです。次のプロジェクトでは、計画の段階で、もっと慎重に費用を計算する必要があると思います。"]],ask:"話し手が一番言いたいことは何ですか。",opts:["期限を守ることが大切だ","費用の見積もりを慎重にすべきだ","チームを大きくしたい","予算を増やしてほしい"],ans:1,exp:"最後的「〜必要があると思います」是主張：計畫階段要更謹慎估算費用。"});
add("N2","gist",{intro:"会社で、女の人と男の人が、新しい制度について話しています。",lines:[["F","来月から、うちの会社でも在宅勤務が週二日までできるようになるそうですね。"],["M","ええ。でも、会議のある日は出社しなきゃいけないし、結局あまり変わらないかもしれませんよ。"],["F","確かに。でも、選べる自由があるのはありがたいです。"]],ask:"二人は、在宅勤務についてどう思っていますか。",opts:["二人とも全面的に賛成している","男の人は効果を疑い、女の人は選べることを評価している","二人とも反対している","女の人は出社を希望している"],ans:1,exp:"男的說「あまり変わらないかも」（懷疑效果）；女的說「選べる自由があるのはありがたい」（肯定可以選擇）。"});

add("N2","integ",{intro:"家族三人が、夏休みの旅行について話しています。",lines:[["F","ねえ、夏休みの旅行、遊園地がいい！"],["M","遊園地は混むし、疲れるよ。お父さんは温泉でゆっくりしたいな。"],["F2","私は海がいいな。でも、お父さんの仕事の都合で、休みは三日しか取れないのよね。"],["M","三日なら、遠い海は無理だな。近くの温泉なら、移動も楽だ。"],["F","温泉かあ…。じゃあ、プールがある温泉施設は？ 遊園地みたいに遊べるし。"],["F2","それなら、みんな楽しめそうね。"],["M","プール付きの温泉施設か。それなら、いいかな。"]],ask:"家族は、どんな旅行にすることにしましたか。",opts:["遊園地に行く旅行","遠い海に行く旅行","プールのある温泉施設に行く旅行","近くの温泉でゆっくりする旅行"],ans:2,exp:"三個人的條件互相折衷：女兒要玩、父親要泡溫泉、母親要海但只有三天——最後是「有泳池的溫泉設施」。"});
add("N2","integ",{intro:"携帯電話の店で、店員がお客さんに二つの料金プランを説明しています。",lines:[["F2","Aプランは月三千円で、データは月五ギガまで。通話は三十秒ごとに二十円かかります。Bプランは月四千五百円で、データは使い放題、通話は一回十分まで無料です。"],["M","うーん。動画はほとんど見ないんですが、仕事で電話はよくするんです。一回が長いと、十分くらいかかることもあります。"],["F2","データが足りるなら、通話の料金次第ですね。月にどのくらい通話をされますか。"],["M","毎日、二、三回、それぞれ十分くらいです。"],["F2","それでしたら、Aプランだと通話料が高くなるので、Bプランのほうが安くなります。"],["M","わかりました。じゃあ、Bプランにします。"]],ask:"お客さんは、どうしてBプランに決めましたか。",opts:["動画をたくさん見るから","データが足りなくなりそうだから","通話が多く、Bのほうが安くなるから","Aプランが売り切れだから"],ans:2,exp:"客人不看影片、資料量夠用；但每天打好幾通十分鐘左右的電話，A 的通話費會變貴，所以 B 反而比較便宜。"});
add("N2","integ",{intro:"会社で、三人が、退職する部長へのプレゼントについて話しています。",lines:[["F","部長への送別のプレゼント、何がいいでしょうね。腕時計はどうかな。"],["M","腕時計は高いし、好みもあるから難しいんじゃないかな。"],["F2","旅行券はどうですか。部長、退職したらゆっくり旅行したいっておっしゃっていましたよ。"],["F","いいですね。でも、旅行券だけだと、ちょっと寂しい気もします。"],["M","じゃあ、みんなでメッセージを書いた色紙を添えようか。"],["F2","それなら、気持ちも伝わりますね。"],["F","じゃあ、旅行券とメッセージ色紙にしましょう。"]],ask:"三人は、何を贈ることにしましたか。",opts:["腕時計","旅行券と色紙","旅行券だけ","花束と色紙"],ans:1,exp:"手錶被否決；旅行券被接受但「只有旅行券有點寂寞」，所以加上大家寫的留言色紙。"});

/* ===== N1 ===== */
add("N1","quick",{lines:[["M","今回の件は、私の不注意でご迷惑をおかけしました。"]],rv:"F",opts:["いえ、お互いさまですから、お気になさらず。","ええ、本当に不注意でしたね。","いえ、ご迷惑をおかけしてもよろしいです。"],ans:0,exp:"對方道歉時，回「お互いさまですから、お気になさらず」是最得體的回應。其他選項不是失禮就是文法錯誤。"});
add("N1","quick",{lines:[["F","この調子で売り上げが伸びれば、目標達成も夢じゃないね。"]],rv:"M",opts:["ええ、油断せずに頑張りましょう。","いえ、夢はありませんでした。","はい、夢で見たことがあります。"],ans:0,exp:"「夢じゃない」是「並非遙不可及」的慣用說法，不是真的「夢」。接著提醒不要大意最自然。"});
add("N1","quick",{lines:[["M","来週の接待、場所はどこでもいいと言われても、かえって困るんだよね。"]],rv:"F",opts:["確かに。いくつか候補を挙げて、選んでいただきましょうか。","ええ、どこにもありませんでした。","困らないように、場所は決めないほうがいいです。"],ans:0,exp:"「かえって困る」＝反而為難。理解了對方的煩惱，並提出具體對策（列幾個候補讓對方選）最合理。"});

add("N1","task",{intro:"会社で、課長と部下が、展示会の準備について話しています。",lines:[["F2","展示会のブース、レイアウトの最終案はできた？"],["M2","はい。ただ、先ほど印刷会社から、パンフレットの納品が一日遅れると連絡がありました。"],["F2","それは困ったな。初日に配る予定だったでしょう。"],["M2","はい。デザインデータを渡せば、近くの別の業者なら明日の朝には刷れるそうですが、費用は少し上がります。"],["F2","費用はやむを得ないけど、部長の許可が必要だね。私から話しておくから、あなたはその業者に見積もりだけ先に出してもらって。"],["M2","承知しました。"]],ask:"男の人は、このあと、まず何をしますか。",opts:["部長に許可をもらう","別の印刷業者に見積もりを頼む","レイアウトの案を修正する","元の印刷会社に納品日を相談する"],ans:1,exp:"部長由課長去說明；部下被指示的是「その業者に見積もりだけ先に出してもらって」。"});
add("N1","task",{intro:"大学で、先生と女の学生が、学会発表のスライドについて話しています。",lines:[["M","発表のスライド、見たよ。内容はいいんだけど、結論が最後まで見えてこない感じがするね。"],["F","結論は最後のスライドにまとめたつもりだったんですが…。"],["M","聴衆は十五分しか聞かないんだから、最初に結論を述べて、そのあと根拠を示す構成のほうが伝わりやすいと思うよ。"],["F","なるほど。では、スライドの順番を入れ替えます。"],["M","その前に、データのグラフ。色が似ていて区別しにくいから、そこを直してからのほうが効率的だな。"],["F","わかりました。"]],ask:"女の学生は、まず何をしますか。",opts:["スライドの順番を入れ替える","グラフの色を直す","結論を最後のスライドにまとめる","発表の時間を短くする"],ans:1,exp:"學生本來想先調換順序，但老師說「その前に」先修圖表顏色比較有效率。"});
add("N1","task",{intro:"ホテルのフロントで、女の人と男のお客さんが話しています。",lines:[["M","すみません、明日の朝の便で出発するので、早朝のタクシーを頼みたいんですが。"],["F","かしこまりました。何時にご出発ですか。"],["M","空港まで四十分かかるので、五時には出たいんです。"],["F","承知しました。ただ、早朝はご予約が混み合いますので、確実にご用意するには、今夜八時までにご確認が必要なんです。"],["M","では今お願いします。朝食は、その時間だと食べられませんよね？"],["F","お弁当をご用意することもできますが…。"],["M","じゃあ、それも頼もうかな。"]],ask:"男の人は、フロントで何を頼みましたか。",opts:["タクシーだけ","タクシーと弁当","弁当だけ","朝食の時間の変更"],ans:1,exp:"男的說「今お願いします」＝叫了計程車；最後也說「それも頼もうかな」＝加訂便當。"});

add("N1","point",{intro:"会社で、女の人と男の人が、新しい制度について話しています。",lines:[["F","今度のフレックスタイム制、どう思います？"],["M","自由に時間を選べるのは魅力的ですが、問題は、会議の時間が合わせにくくなることですね。"],["F","確かに。連絡が取りにくくなりかねませんね。"],["M","ええ。働く時間より、むしろ連携の取りやすさをどう確保するかが課題でしょう。"]],ask:"男の人は、新しい制度のどこが問題だと言っていますか。",opts:["働く時間が長くなること","給料が下がること","連携が取りにくくなること","制度の説明が難しいこと"],ans:2,exp:"「〜かねない」表示有可能變成不好的結果。男的指出課題是如何確保「連携の取りやすさ」。"});
add("N1","point",{intro:"大学の友達同士が、研究について話しています。",lines:[["M","研究テーマ、変えたんだって？"],["F","ええ。前のテーマは、資料が少なくて行き詰まっていたの。それに、指導教官にも、もっと社会に役立つ分野を考えてみたらと言われて。"],["M","じゃあ、先生に言われたから？"],["F","それもあるけど、決め手は、資料不足で先に進めなくなったことかな。"]],ask:"女の人が研究テーマを変えた一番の理由は何ですか。",opts:["先生に勧められたから","資料が足りず研究が進まなかったから","社会の役に立つ分野に興味があるから","前のテーマに飽きたから"],ans:1,exp:"「それもあるけど、決め手は〜」——先生的建議只是其次，決定性原因是資料不足。"});
add("N1","point",{intro:"お店で、お客さんの男の人と店主の女の人が話しています。",lines:[["M","このお店、来月閉めるって本当ですか。"],["F","ええ。売り上げが落ちたのも事実ですが、それ以上に、私も年を取って、仕入れや仕込みがきつくなってきたものですから。"],["M","そうですか。寂しくなりますね。"]],ask:"店主が閉店を決めた一番の理由は何ですか。",opts:["売り上げが減ったから","店の建物が古くなったから","店主の体力的な負担が大きくなったから","近くに新しい店ができたから"],ans:2,exp:"「それ以上に〜」＝比營收減少更重要的是「年紀大了，進貨和準備太吃力」。"});

add("N1","gist",{intro:"大学の授業で、先生が話しています。",lines:[["M","最近、フードロス、つまり、まだ食べられるのに捨てられてしまう食べ物の問題が注目されています。個人が買いすぎない、使い切るといった努力も大切ですが、実は、家庭より、小売店や飲食店から出る量のほうが多いと言われています。そのため、企業側の取り組みも不可欠でしょう。"]],ask:"話の要点は何ですか。",opts:["フードロスは企業と個人の両方で取り組むべきだが、企業側の対策が欠かせない","フードロスの責任は主に家庭にある","フードロスはもう解決した","食べ物は安く買うべきだ"],ans:0,exp:"個人努力很重要，但「家庭より小売店や飲食店のほうが多い」，所以結論是「企業側の取り組みも不可欠」。"});
add("N1","gist",{intro:"ラジオで、女の人が話しています。",lines:[["F","新しい技術が登場すると、「仕事が奪われる」という不安の声が必ず上がります。確かに、なくなる仕事はあるでしょう。しかし歴史を振り返れば、技術は新しい仕事も生み出してきました。大切なのは、変化を恐れるのではなく、学び続ける姿勢だと思います。"]],ask:"話し手の主張は何ですか。",opts:["新しい技術は規制すべきだ","技術で仕事がなくなるので学んでも無駄だ","変化に対して学び続けることが大切だ","歴史は繰り返さない"],ans:2,exp:"「確かに〜、しかし〜」先讓步再轉折。主張在最後：不要害怕變化，要持續學習。"});
add("N1","gist",{intro:"二人が、小説について話しています。",lines:[["M","この小説、評判ほど面白くなかったな。"],["F","そう？ 私は、最初は退屈だったけど、終わりのほうで、ああ、この人物の行動にはこういう意味があったんだって、全部つながって、読み終わってからじわじわ良さがわかってきたよ。"],["M","へえ。じゃあ、もう一度読み直したら、印象が変わるかもな。"]],ask:"女の人は、この小説をどう評価していますか。",opts:["最初から最後まで面白かった","最後まで退屈だった","最初は退屈だったが、読み終えてから良さがわかった","登場人物が理解できなかった"],ans:2,exp:"「最初は退屈だったけど〜じわじわ良さがわかってきた」＝一開始無聊，讀完後才慢慢體會到好。"});

add("N1","integ",{intro:"大学の授業で、先生がごみ収集の有料化について、三つの案を紹介しています。そのあと、学生が意見を言っています。",lines:[["M","ごみ収集の有料化には、三つの案が考えられます。A案は、すべての世帯から一律の料金を取る方法です。B案は、出したごみの量に応じて、料金が変わる方法です。C案は、有料化せず、啓発活動でごみを減らしてもらう方法です。では、意見を聞かせてください。"],["F","私は、B案がいいと思います。ごみを減らす努力をした人が得をするので、公平ですし、実際にごみが減る効果も期待できるからです。ただ、不法投棄が増えるおそれがあるので、監視の仕組みも必要だと思います。"],["M2","僕はC案です。有料化は、低所得の家庭に負担が重いです。教育で意識を変えるほうが、長い目で見れば効果があるはずです。"],["M","なるほど。"]],ask:"女の学生が支持している案と、その案への心配を、正しく述べているのはどれですか。",opts:["B案、不法投棄が増えること","A案、料金が高いこと","B案、料金が高いこと","C案、効果が出るまで時間がかかること"],ans:0,exp:"女學生支持 B 案（依量計費），擔心的是「不法投棄」增加。C 案是男學生支持的。"});
add("N1","integ",{intro:"夫婦が、引っ越し業者の説明を聞いたあと、話し合っています。",lines:[["F2","三つのプランがございます。Aプランは、荷造りも荷ほどきもすべて当社が行います。料金は十二万円です。Bプランは、荷造りはお客様、運搬のみ当社で、八万円です。Cプランは、荷造りも運搬もお客様で、トラックをお貸しするだけで、四万円です。"],["M","うーん、Aは高いな。"],["F","でも、私は仕事が忙しくて、荷造りをする時間がほとんどないのよ。"],["M","僕が週末に荷造りするよ。ただ、運搬は重い家具が多いから、自分たちではできないな。"],["F","じゃあ、荷造りは私たちでして、運搬だけ頼もう。"],["M","そうだね。Bにしよう。"]],ask:"二人が選んだプランと、その理由として正しいのはどれですか。",opts:["Aプラン、時間がないから","Bプラン、重い家具を自分たちで運べないから","Bプラン、いちばん安いから","Cプラン、トラックを借りられるから"],ans:1,exp:"荷造り男的週末可以做，但搬運因為家具重沒辦法自己來，所以選 B。最便宜的是 C，所以「いちばん安い」不對。"});
add("N1","integ",{intro:"ラジオ番組で、司会者と二人の専門家が、週休三日制について話しています。",lines:[["F","週休三日制について、お二人のご意見を伺います。まず、田中さんからお願いします。"],["M","私は、導入を進めるべきだと考えています。休みが増えれば、社員の満足度が上がり、結果的に生産性も上がるという調査結果が出ているからです。"],["F","ありがとうございます。山口さんはいかがですか。"],["F2","趣旨には賛成なんですが、現実には、人手の足りない中小企業にとって、休みを増やすのはかなりの負担です。大企業と同じように進めるのは難しいと思います。"],["M","確かに、支援の仕組みは必要ですね。"],["F2","ええ、国の支援が前提になるでしょう。"]],ask:"二人の専門家の意見について、正しいのはどれですか。",opts:["男性は導入に賛成し、女性は中小企業の負担を心配している","男性は反対し、女性は賛成している","二人とも、今すぐ全企業で導入すべきだと考えている","二人とも導入は不可能だと考えている"],ans:0,exp:"田中（男）：賛成，理由是滿意度與生産力。山口（女）：贊成主旨但擔心中小企業負擔，需要國家支援。"});

/* ===== N3 追加問題 ===== */
add("N3","quick",{lines:[["M","この荷物、どこに置けばいいですか。"]],rv:"F",opts:["そこの棚の上にお願いします。","はい、置いておきました。","ええ、置いたことがあります。"],ans:0,exp:"「どこに〜ばいいですか」問放置的位置，要回答地點。「棚の上にお願いします」最自然。"});
add("N3","quick",{lines:[["F","来週の飲み会、行けそう？"]],rv:"M",opts:["ごめん、その日はちょっと用事があって。","うん、行ったことがあるよ。","いいえ、行きそうでした。"],ans:0,exp:"「行けそう？」是問「能不能去」。婉拒時常用「ごめん、その日はちょっと用事があって」。"});
add("N3","quick",{lines:[["M","すみません、ちょっと道をお尋ねしたいんですが。"]],rv:"F",opts:["はい、どちらへ行かれますか。","はい、尋ねてください。","いいえ、道はありません。"],ans:0,exp:"有人問路時，先問對方「要去哪裡」最自然。"});
add("N3","quick",{lines:[["F","田中さん、お客様がお見えになりました。"]],rv:"M",opts:["わかりました。すぐ行きます。","お見えになっていただきます。","はい、見えませんでした。"],ans:0,exp:"「お見えになる」是「来る」的尊敬語。聽到客人到了，回「すぐ行きます」。"});
add("N3","task",{intro:"駅で、女の人が駅員に聞いています。",lines:[["F","すみません、東京行きの電車は何番ホームですか。"],["M","東京行きは三番ホームですが、今、事故で止まっています。"],["F","えっ、いつ動きますか。"],["M","まだわかりません。同じ駅の四番ホームから出る急行なら、動いていますよ。そちらのほうが早く着くと思います。"],["F","わかりました。ありがとうございます。"]],ask:"女の人は、このあと、どうしますか。",opts:["三番ホームで待つ","四番ホームに行く","事故の様子を調べる","駅員に切符を返す"],ans:1,exp:"三番線因事故停駛，駅員建議搭四番線的急行。女的說「わかりました」，所以去四番ホーム。"});
add("N3","task",{intro:"駅の前で、男の人と女の人が話しています。",lines:[["M","すみません、郵便局はどこですか。"],["F","駅を出て、まっすぐ行くと、交差点があります。"],["M","はい。"],["F","交差点の左側にコンビニがあって、郵便局は、その向かい、道を渡った右側です。"],["M","ありがとうございます。"]],ask:"郵便局は、どこにありますか。",opts:["交差点の右側","交差点の左側","銀行の隣","公園の前"],ans:0,exp:"「コンビニの向かい、道を渡った右側」→交叉路口的右側。左側是便利商店，注意不要被先聽到的地標誤導。"});
add("N3","task",{intro:"大学で、先生と男の学生が話しています。",lines:[["M","先生、この本を読みたいんですが、図書館で探したら貸し出し中でした。"],["F","ああ、その本は図書館に一冊しかないからね。"],["M","どうすればいいでしょうか。"],["F","まず、図書館のカウンターで予約をしておくといいよ。返却されたら連絡が来るから。それまでは、この論文を読んでおいて。"],["M","はい、わかりました。"]],ask:"男の学生は、まず何をしますか。",opts:["別の本を探す","図書館で予約をする","先生に本を借りる","論文を読む"],ans:1,exp:"先生說「まず、図書館のカウンターで予約をしておくといい」。論文是「それまでは」（等待期間）才讀，不是第一步。"});
add("N3","task",{intro:"引っ越しの手伝いで、男の人と女の人が部屋で話しています。",lines:[["M","本棚はテレビの左でいい？"],["F","うん、お願い。ソファーは窓の近くじゃなくて、壁のほうに置いてくれる？"],["M","わかった。この植木鉢はどうする？ 日が当たるところがいいよね。"],["F","そうだね。じゃあ、窓の近くに置いて。"],["M","了解。"]],ask:"植木鉢は、どこに置きますか。",opts:["テレビの左","壁のそば","窓の近く","本棚の上"],ans:2,exp:"「日が当たるところ」→「窓の近くに置いて」。注意：沙發才是放牆邊，植物放窗邊。"});
add("N3","point",{intro:"コンビニで、女の人と男の人が話しています。",lines:[["M","お昼、お弁当買わないの？"],["F","うん、今日は買わない。いつもコンビニのお弁当だと、野菜が足りないから、自分で作ることにしたの。"],["M","えらいね。続けられそう？"],["F","どうかな。でも、安いし、体にもいいから、頑張ってみる。"]],ask:"女の人は、どうしてお弁当を買いませんか。",opts:["お金がないから","野菜が足りないから","時間があるから","店が閉まっているから"],ans:1,exp:"理由是「野菜が足りないから」。「安いし」只是附加好處，不是主要原因。"});
add("N3","point",{intro:"電話で、レストランの店員と男の人が話しています。",lines:[["F","お電話ありがとうございます。レストラン花です。"],["M","あの、今夜七時に予約した山田ですが、キャンセルをお願いできますか。"],["F","かしこまりました。ご都合が悪くなりましたか。"],["M","ええ、実は、急に子どもが熱を出してしまって。すみません。"],["F","それは心配ですね。どうぞお大事に。"]],ask:"男の人は、どうしてキャンセルしましたか。",opts:["仕事が入ったから","子どもが熱を出したから","店が遠いから","時間を間違えたから"],ans:1,exp:"「急に子どもが熱を出してしまって」是取消的理由。"});
add("N3","point",{intro:"学校で、男の学生と女の学生が話しています。",lines:[["F","アルバイト、やめたんだって？ 仕事が大変だったの？"],["M","ううん、仕事は楽しかったよ。ただ、来月から試験が続くから、勉強する時間を作りたくて。"],["F","そっか。お金は大丈夫？"],["M","うん、少し貯金があるから、しばらくは平気。"]],ask:"男の学生は、どうしてアルバイトをやめましたか。",opts:["仕事が大変だったから","お金がたまったから","勉強の時間がほしいから","店の人と合わなかったから"],ans:2,exp:"先排除「仕事は楽しかった」，真正的理由是「勉強する時間を作りたくて」。"});
add("N3","point",{intro:"会社で、男の人と女の人が話しています。",lines:[["F","最近、毎朝走ってるんだって？ 何かきっかけがあったの？"],["M","うん、先月の健康診断で、もう少し運動したほうがいいって言われてね。"],["F","へえ。友達に誘われたんじゃないんだ。"],["M","うん。一人で走るのも、気持ちがいいよ。"]],ask:"男の人は、どうして走り始めましたか。",opts:["友達に誘われたから","健康診断で言われたから","走るのが好きだから","新しい靴を買ったから"],ans:1,exp:"「先月の健康診断で、運動したほうがいいって言われて」是契機。女的猜「友達に誘われた」被否定了。"});
add("N3","gist",{intro:"駅の放送です。",lines:[["F","ご利用のお客様にお知らせいたします。ただいま、強い風の影響で、一部の電車に遅れが出ております。電車が遅れているお客様には、遅延証明書を駅員がお渡ししますので、改札口でお申し出ください。"]],ask:"この放送は、何についてのお知らせですか。",opts:["電車の遅れと遅延証明書","新しい電車の時刻表","駅の工事の予定","切符の値上げ"],ans:0,exp:"重點：因強風電車延誤，可向站員領取「遅延証明書」。"});
add("N3","gist",{intro:"友達同士が話しています。",lines:[["F","今度の日曜日、時間ある？ 映画のチケットが二枚あるんだけど、一緒に行かない？"],["M","いいね。何の映画？"],["F","最近話題の、ミステリー。でも、見たことあるなら、別の人を誘うよ。"],["M","まだ見てないよ。ぜひ行こう。"]],ask:"二人は、何について話していますか。",opts:["映画に行く約束","映画の感想","チケットの買い方","日曜日の天気"],ans:0,exp:"女的邀請看電影，男的答應，整段是在約定「一起去看電影」。"});
add("N3","gist",{intro:"市役所の放送です。",lines:[["M","市民の皆様にお知らせします。来月から、ごみの出し方が変わります。これまで同じ日に出していた、プラスチックと紙のごみを、別々の日に出していただくことになりました。詳しい日程は、市のホームページか、お配りするチラシでご確認ください。"]],ask:"この放送の内容は、何ですか。",opts:["ごみの出し方が変わること","ごみ収集が無料になること","チラシの配り方","市役所の引っ越し"],ans:0,exp:"主旨是「ごみの出し方が変わる」（塑膠與紙類分開不同日丟）。"});
add("N3","gist",{intro:"空港の放送です。",lines:[["F","大阪行き二〇三便をご利用のお客様にお知らせいたします。搭乗口が、十二番から十五番に変わりました。お間違えのないよう、ご注意ください。まもなく、ご搭乗が始まります。"]],ask:"この放送は、何を伝えていますか。",opts:["飛行機が遅れること","搭乗口が変わったこと","荷物を預ける場所","空港の閉店時間"],ans:1,exp:"關鍵是「搭乗口が十二番から十五番に変わりました」（登機口變更）。"});
add("N3","utter",{ask:"レストランで、注文したものを変えたくなりました。店員に、何と言いますか。",rv:"F",opts:["すみません、注文を変えてもいいですか。","すみません、注文を変えさせてあげましょうか。","すみません、注文が変わりました。"],ans:0,exp:"想更改點的餐，用「〜てもいいですか」詢問許可最自然。其他兩項的授受或自他動詞都不對。"});
add("N3","utter",{ask:"先生の話が早くて、よくわかりませんでした。先生に、何と言いますか。",rv:"F",opts:["すみません、もう少しゆっくり言っていただけませんか。","すみません、もう少しゆっくり言ってあげましょうか。","すみません、もう少しゆっくり言わせてください。"],ans:0,exp:"請對方再說慢一點，用「〜ていただけませんか」。「あげる」「させてください」方向相反。"});
add("N3","utter",{ask:"電車で、お年寄りが立っています。席を譲りたいとき、何と言いますか。",rv:"F",opts:["よろしければ、どうぞおかけください。","ここは私の席ですから、座らないでください。","どうぞ、立ってください。"],ans:0,exp:"讓座時說「よろしければ、どうぞおかけください」，禮貌又自然。"});
add("N3","utter",{ask:"同僚が、あなたの仕事を手伝ってくれました。お礼を言うとき、何と言いますか。",rv:"F",opts:["おかげで助かりました。ありがとうございます。","お先に失礼します。","これからもよろしくお願いします。"],ans:0,exp:"感謝對方幫忙，常說「おかげで助かりました」。其他兩句是下班和打招呼用語。"});

add("N2","task",{intro:"会社で、男の人と女の人が、新入社員の研修について話しています。",lines:[["M","来週からの新入社員の研修、会場の準備は進んでる？"],["F","はい。机と椅子は並べ終わりました。ただ、プロジェクターが一台壊れていて、修理に出しています。"],["M","それは困ったな。修理はいつ終わる？"],["F","来週の月曜日です。研修は火曜日からなので、間に合いそうです。"],["M","それなら大丈夫か。じゃあ、念のため、予備を総務に借りておいてくれる？"],["F","わかりました。連絡しておきます。"]],ask:"女の人は、このあと、何をしますか。",opts:["机と椅子を並べる","プロジェクターを修理に出す","総務にプロジェクターを借りる","研修の日程を変える"],ans:2,exp:"桌椅已排好，投影機已送修。最後被要求的是「予備を総務に借りておく」，所以聯絡總務借備用的。"});
add("N2","task",{intro:"銀行で、女の人と銀行員が話しています。",lines:[["M","本日は、どのようなご用件でしょうか。"],["F","口座を作りたいんですが、必要なものを教えていただけますか。"],["M","身分証明書と、印鑑が必要です。お持ちですか。"],["F","身分証明書はあるんですが、印鑑は家に置いてきてしまって。"],["M","そうですか。サインでも大丈夫ですので、こちらの用紙に記入をお願いします。"],["F","よかった。わかりました。"]],ask:"女の人は、まず何をしますか。",opts:["家に印鑑を取りに帰る","身分証明書を出す","用紙に記入する","口座の番号を調べる"],ans:2,exp:"沒帶印章，但「サインでも大丈夫」。所以接著要做的是「用紙に記入」（填表）。"});
add("N2","task",{intro:"旅行会社で、男の人と店員の女の人が話しています。",lines:[["F","ご予約の変更でしょうか。"],["M","はい。来月の沖縄旅行なんですが、仕事の都合で、出発を二日遅らせたいんです。"],["F","確認いたします。…二日遅らせると、ホテルの料金が少し上がりますが、よろしいですか。"],["M","構いません。あ、でも、飛行機は予約済みなので、そちらの変更も必要ですよね。"],["F","はい。航空会社への連絡は、こちらで行います。お客様は、変更の申込書にご記入だけお願いします。"]],ask:"男の人は、このあと、何をしますか。",opts:["航空会社に連絡する","ホテルに料金を払う","申込書に記入する","旅行をキャンセルする"],ans:2,exp:"航空公司聯絡由旅行社處理，客人只需「申込書にご記入」。"});
add("N2","task",{intro:"大学で、先生と男の学生が話しています。",lines:[["M","先生、来週の実験なんですが、器具の準備はどうすればよろしいでしょうか。"],["F","基本的には私が用意するけど、ガラスの器具は数が足りないかもしれないから、先に倉庫で確認しておいてくれる？"],["M","はい。足りなかったらどうしましょう。"],["F","足りない分は、リストにして私に送って。私が注文するから。"],["M","わかりました。"]],ask:"男の学生は、まず何をしますか。",opts:["器具を注文する","倉庫で器具の数を確認する","リストを先生に送る","実験の日を変更する"],ans:1,exp:"順序：①先在倉庫確認數量 ②不夠的做成清單寄給老師。所以最先是確認數量。"});
add("N2","task",{intro:"会社で、課長と女の人が話しています。",lines:[["M","来週の取引先との会食だけど、店は決まった？"],["F","はい、駅前の和食の店を予定しています。ただ、まだ予約はしていません。"],["M","あの店は人気だから、早く予約したほうがいいよ。それと、先方に好き嫌いやアレルギーがないか、確認した？"],["F","あっ、それはまだです。"],["M","予約の前に、それを聞いたほうがいいね。コースの内容にも関わるから。"],["F","承知しました。すぐ連絡します。"]],ask:"女の人は、まず何をしますか。",opts:["店を予約する","先方にアレルギーなどを確認する","別の店を探す","課長に店の名前を伝える"],ans:1,exp:"課長說「予約の前に、それを聞いたほうがいい」。所以第一步是先問對方有無過敏／偏好。"});
add("N2","point",{intro:"会社で、女の人と男の人が話しています。",lines:[["F","田中さん、今度のプロジェクト、断ったんだって？"],["M","うん。興味はあったんだけど、今抱えている仕事で手いっぱいで、これ以上は無理だと思って。"],["F","そうなんだ。上司に反対されたわけじゃないんだね。"],["M","うん。自分で判断したんだ。"]],ask:"男の人が、プロジェクトを断った理由は何ですか。",opts:["興味がなかったから","上司に反対されたから","今の仕事が忙しいから","給料が低いから"],ans:2,exp:"「今抱えている仕事で手いっぱい」＝現在手上工作已滿檔。「興味はあった」「上司に反対されたわけじゃない」都被否定。"});
add("N2","point",{intro:"大学で、男の学生と女の学生が話しています。",lines:[["F","ゼミ、変えたの？ 前のゼミ、楽しいって言ってたじゃない。"],["M","楽しかったよ。ただ、卒業後は海外で働きたいから、英語で議論できるゼミのほうが役に立つと思って。"],["F","なるほど。先生が厳しかったからじゃないんだね。"],["M","全然。先生は優しかったよ。"]],ask:"男の学生がゼミを変えた理由は何ですか。",opts:["前のゼミがつまらなかったから","先生が厳しかったから","将来のために英語を使いたいから","友達が移ったから"],ans:2,exp:"理由是「海外で働きたい→英語で議論できるゼミが役に立つ」。其他選項被明確否定。"});
add("N2","point",{intro:"ホテルのフロントで、男の人と女の人が話しています。",lines:[["M","すみません、部屋を替えてもらえませんか。"],["F","どうかなさいましたか。"],["M","眺めは素晴らしいんですが、隣の部屋の音が気になって、眠れなかったんです。"],["F","申し訳ございません。静かなお部屋をご用意します。"]],ask:"男の人は、どうして部屋を替えてほしいのですか。",opts:["景色がよくないから","部屋が狭いから","隣の部屋の音がうるさいから","料金が高いから"],ans:2,exp:"「眺めは素晴らしい」被稱讚，問題是「隣の部屋の音が気になって眠れなかった」。"});
add("N2","point",{intro:"会社で、二人が話しています。",lines:[["F","あの店、閉店するらしいですね。人気があったのに、どうしてでしょう。"],["M","売り上げが悪かったわけじゃないらしいですよ。オーナーが高齢になって、後継ぎがいないからだそうです。"],["F","そうなんですか。残念ですね。"]],ask:"その店が閉店する理由は何ですか。",opts:["売り上げが悪かったから","店が古くなったから","後継ぎがいないから","客が減ったから"],ans:2,exp:"「売り上げが悪かったわけじゃない」被否定，真正原因是「後継ぎがいない」。"});
add("N2","point",{intro:"駅で、男の人と女の人が話しています。",lines:[["M","電車、遅れてるみたいだね。"],["F","うん。人身事故だって。再開まで、一時間くらいかかるらしいよ。"],["M","それは困ったな。バスで行く？"],["F","バスも混んでるだろうから、タクシーのほうがいいかも。割り勘にすれば、そんなに高くないし。"]],ask:"女の人は、どうしてタクシーがいいと言っていますか。",opts:["バスがないから","電車が動かないから","バスが混んでいそうで、割り勘なら安いから","タクシーが好きだから"],ans:2,exp:"理由有兩點：公車可能很擠、「割り勘」之下計程車不貴。電車停駛只是背景。"});
add("N2","gist",{intro:"大学の授業で、先生が話しています。",lines:[["F","最近、「ながら食事」、つまり、テレビやスマートフォンを見ながら食事をする人が増えています。しかし、食事に集中しないと、食べすぎにつながりやすいという研究結果があります。また、家族との会話も減ってしまいます。食事のときは、画面から離れる習慣が大切です。"]],ask:"この話の主なポイントは何ですか。",opts:["食事中の画面を控えるべきだ","テレビは家族で見るべきだ","食べる量を増やすべきだ","研究はまだ足りない"],ans:0,exp:"結論在最後一句：「食事のときは、画面から離れる習慣が大切」。"});
add("N2","gist",{intro:"ラジオで、男の人が話しています。",lines:[["M","新しい趣味を始めたいけれど、続かない、という方は多いと思います。その原因の一つは、最初から高い目標を立ててしまうことです。まずは「週に一回、十分だけ」といった小さな目標から始めてみてください。小さな成功が積み重なると、自然と続くようになります。"]],ask:"話し手が一番言いたいことは何ですか。",opts:["趣味にはお金をかけるべきだ","小さな目標から始めると続けやすい","趣味は一つに絞るべきだ","高い目標が大切だ"],ans:1,exp:"主旨：「小さな目標から始めてみてください。小さな成功が積み重なると続く」。"});
add("N2","gist",{intro:"会社で、二人が新しいオフィスについて話しています。",lines:[["F","来月から、席が自由になるそうですね。フリーアドレスっていうんでしたっけ。"],["M","ええ。部署を超えて話しやすくなるのは、いい点だと思います。"],["F","でも、荷物の置き場所に困りませんか。私は、自分の席がないと落ち着かなくて。"],["M","確かに、慣れるまでは大変でしょうね。"]],ask:"二人は、フリーアドレスについて、どう考えていますか。",opts:["二人とも完全に反対している","男の人は利点を、女の人は不便な点を挙げている","二人とも賛成している","二人とも制度を知らない"],ans:1,exp:"男：部署を超えて話しやすい（利）；女：荷物と落ち着かない（弊）。兩人觀點不同。"});
add("N2","gist",{intro:"駅で、アナウンスが流れています。",lines:[["F","ご案内いたします。ただいま、信号機の故障のため、全線で運転を見合わせております。再開の見込みは、現在のところ立っておりません。ほかの路線への振り替え輸送を、ご利用ください。"]],ask:"このアナウンスの内容は何ですか。",opts:["運転再開の時刻","故障で電車が止まり、代わりの路線を案内している","電車の混雑状況","新しい信号機の導入"],ans:1,exp:"信號故障→全線停駛、再開時間未定→請利用「振り替え輸送」（轉乘替代路線）。"});
add("N2","gist",{intro:"ラジオで、女の人が話しています。",lines:[["F","日本では、少子化が進み、学校の統合が増えています。生徒が減ることで、部活動ができなくなったり、通学に時間がかかったりする問題が出ています。一方で、少人数のため、先生が一人ひとりに丁寧に指導できるという良い面もあります。"]],ask:"この話の内容として、最も近いものはどれですか。",opts:["少子化には悪い点しかない","学校の統合には、問題点と良い点の両方がある","部活動は増えている","先生の数が増えている"],ans:1,exp:"說明問題（部活動、通學）後以「一方で」帶出好處，整體是兩面並陳。"});
add("N2","gist",{intro:"会社で、上司が話しています。",lines:[["M","来月から、会議の時間を一回あたり三十分以内にすることにします。長い会議は、集中力が落ちて、結論が出にくいためです。会議の前に資料を共有して、当日は議論に集中できるようにしてください。"]],ask:"この話の要点は何ですか。",opts:["会議は三十分以内にし、事前に資料を共有する","会議の回数を増やす","資料は当日に配る","会議を全部やめる"],ans:0,exp:"兩個要點：會議一次三十分內、事前共享資料。"});
add("N2","integ",{intro:"大学で、三人の学生が、サークルの新歓イベントについて話しています。",lines:[["F","新歓イベント、何をする？ 私は、バーベキューがいいと思う。"],["M","バーベキューは天気に左右されるし、準備も大変だよ。体育館でスポーツ大会のほうが確実じゃない？"],["F2","でも、スポーツが苦手な新入生もいるよ。みんなが参加しやすいほうがいいな。"],["M","じゃあ、室内でできるゲーム大会はどう？ 雨でも大丈夫だし、準備も簡単だよ。"],["F","それなら、運動が苦手でも楽しめるね。"],["F2","賛成！ お菓子も用意しよう。"]],ask:"三人は、何をすることにしましたか。",opts:["バーベキュー","体育館でのスポーツ大会","室内でのゲーム大会","お菓子作り"],ans:2,exp:"條件：不受天氣影響、準備簡單、不擅運動也能參加→「室内でできるゲーム大会」。"});
add("N2","integ",{intro:"不動産屋で、店員が二つの部屋を紹介しています。",lines:[["F","Aの部屋は、駅から徒歩五分ですが、築三十年で家賃は八万円です。Bの部屋は、駅から徒歩十五分ですが、築五年で家賃は七万円です。"],["M","うーん。毎日、自転車で通勤するつもりなので、駅からの距離はあまり気になりません。"],["F","そうですか。Bの部屋には、駐輪場もついていますよ。"],["M","それなら、新しくて安いBのほうがいいですね。"]],ask:"男の人が、Bの部屋に決めた理由は何ですか。",opts:["駅に近いから","自転車を使うので距離が気にならず、新しくて安いから","駐車場があるから","広いから"],ans:1,exp:"男的條件：騎腳踏車通勤→離車站遠沒關係；加上B比較新又便宜，且有停車場（駐輪場）。"});
add("N2","integ",{intro:"会社で、三人が、社内旅行の行き先について話しています。",lines:[["F","社内旅行、北海道と沖縄の二つの案があるけど、どっちがいい？"],["M","僕は沖縄がいいな。海で泳げるし。"],["F2","沖縄は、飛行機代が高いんじゃない？ 予算が限られているから、北海道のほうが安く済むと思う。"],["F","調べてみたら、今は北海道のほうが、飛行機もホテルも安いみたい。"],["M","そうなんだ。じゃあ、予算を考えると、北海道かな。"],["F2","うん、賛成。"]],ask:"三人は、どこに行くことにしましたか。",opts:["沖縄","北海道","九州","行かない"],ans:1,exp:"預算有限，調查後北海道的機票和旅館都比較便宜，男的也改變心意。"});
add("N2","integ",{intro:"家で、親子三人が、新しい家電について話しています。",lines:[["F","洗濯機を買い替えたいんだけど、Aは乾燥機能つきで十二万円、Bは洗濯だけで六万円よ。"],["M","乾燥機能は便利だけど、うちは庭があるから、天気がいい日は外で干せるし。"],["F2","でも、雨の日が多いと困るよね。乾燥機能があると、洗濯物が部屋に増えないし。"],["F","確かに、梅雨の時期は大変だったわね。値段は倍だけど、長く使うものだから、Aにしましょうか。"],["M","そうだね。そうしよう。"]],ask:"家族は、どうしてAを選びましたか。",opts:["値段が安いから","雨の日でも洗濯物を乾かせて、長く使うものだから","庭がないから","新しいデザインだから"],ans:1,exp:"考量：雨天困擾（梅雨）＋長期使用，雖然貴一倍仍選A。"});
add("N2","integ",{intro:"会議室で、三人が、ポスターのデザインについて話しています。",lines:[["F","ポスターの案、AとBがあります。Aは、写真が大きくて目を引きますが、文字が少なく、情報が足りません。Bは、情報は十分ですが、少し地味です。"],["M","イベントの日時と場所が伝わらないと意味がないから、情報は大事だよね。"],["F2","でも、目を引かないと、見てもらえないよ。Bの上に、大きな写真を入れたらどう？"],["F","いい案ですね。情報はBのまま、写真を大きくしましょう。"]],ask:"三人は、どうすることにしましたか。",opts:["Aをそのまま使う","Bをそのまま使う","Bの情報に大きな写真を加える","ポスターをやめる"],ans:2,exp:"結論：保留B的資訊量，再加上大照片（取兩案優點）。"});

add("N1","quick",{lines:[["F","この件、部長に報告するまでもないとは思うんですが、念のためお耳に入れておきます。"]],rv:"M",opts:["そうですか。では、私から伝えておきましょう。","ええ、報告するまでもなかったですね。","いえ、お耳に入れないでください。"],ans:0,exp:"「〜までもない」＝不需要特地…。「お耳に入れる」是向上司報告的謙讓說法。對方是在知會，回應「那我來轉達」最自然。"});

add("N1","task",{intro:"会社で、課長と部下の女の人が、新商品の発売について話しています。",lines:[["M","新商品の発売日、来月一日で進めていたけど、工場から、部品の到着が遅れるという連絡があってね。"],["F","えっ、どのくらい遅れるんですか。"],["M","一週間ほどらしい。発売日を延ばすか、予定どおり出して数を絞るか、悩むところなんだ。"],["F","広告はもう、来月一日で出す手配をしてしまっていますよね。"],["M","そう。だから、今日中に広告会社に、変更が可能かどうかを確認してくれないか。その返事を聞いてから、判断しよう。"],["F","承知しました。"]],ask:"女の人は、まず何をしますか。",opts:["工場に部品の到着日を確認する","広告会社に変更が可能か確認する","発売日を延ばすと決める","販売数を減らす案を作る"],ans:1,exp:"課長要求「今日中に広告会社に変更が可能かを確認」。判斷要等回覆之後，所以第一步是確認廣告。"});
add("N1","task",{intro:"大学の研究室で、先生と男の学生が話しています。",lines:[["F","データの解析結果、見せてもらったけど、この数値、ちょっと不自然だよね。"],["M","やはりそうでしょうか。実は、私も気になっていました。"],["F","まず、元のデータの入力ミスがないか、見直してみて。それで問題がなければ、解析の手順を確認しよう。"],["M","わかりました。手順の確認も、並行して進めたほうがいいでしょうか。"],["F","いや、順番にやったほうが原因を切り分けやすいから、まずは入力のほうだけにして。"]],ask:"男の学生は、まず何をしますか。",opts:["解析の手順を確認する","元のデータの入力ミスを調べる","新しいデータを取る","先生にグラフを見せる"],ans:1,exp:"先生說「まず入力ミスの見直し」，並且明確說不要同時進行，要依序。"});
add("N1","task",{intro:"役所の窓口で、女の人と職員が話しています。",lines:[["M","引っ越しに伴う転入届ですね。以前お住まいの市からの、転出証明書はお持ちですか。"],["F","はい、こちらです。あと、子どもの転校の手続きも必要だと聞いたんですが。"],["M","転校については、こちらではなく、教育委員会の窓口になります。そちらは別の階です。"],["F","そうですか。先に転入届を出したほうがいいですか。"],["M","はい。転入届を出すと、転入学通知書が発行されますので、それを持って教育委員会へ行ってください。"]],ask:"女の人は、まず何をしますか。",opts:["教育委員会に行く","転出証明書を取りに帰る","転入届を出す","子どもの学校に連絡する"],ans:2,exp:"順序：先提出「転入届」→領到轉入學通知書→再去教育委員會辦轉學。"});
add("N1","task",{intro:"会社で、先輩と後輩の男の人が、取引先へのお詫びについて話しています。",lines:[["F","今回の納品ミスの件、先方はかなりお怒りだったよ。"],["M","申し訳ありません。すぐにお詫びに伺ったほうがいいでしょうか。"],["F","その前に、原因を整理して、再発防止策をまとめておいて。何も説明できないまま行っても、かえって印象が悪いから。"],["M","わかりました。資料を作ったら、お見せします。"],["F","うん。それを見て、私も同行するかどうか決めるよ。"]],ask:"男の人は、このあと、まず何をしますか。",opts:["取引先に電話する","原因と再発防止策を整理する","先輩と一緒に取引先へ行く","納品書を作り直す"],ans:1,exp:"先輩說「その前に、原因を整理して、再発防止策をまとめて」。拜訪道歉是之後的事。"});
add("N1","task",{intro:"ホテルで、女の人とスタッフが話しています。",lines:[["M","ご宿泊の延長をご希望とのことですが、お客様のお部屋は、明日、先に予約が入っておりまして。"],["F","そうですか。同じ部屋でないと無理ですか。"],["M","いえ、お部屋を替えていただければ、延長は可能です。ただ、少し狭いお部屋になりますが。"],["F","それは構いません。荷物はどうしたらいいですか。"],["M","お荷物は、こちらでお運びいたします。お客様は、フロントで、延長の手続きだけお願いします。"]],ask:"女の人は、このあと、何をしますか。",opts:["荷物を運ぶ","部屋を替える","延長の手続きをする","チェックアウトする"],ans:2,exp:"荷物由飯店搬運，客人只要「フロントで延長の手続き」。"});
add("N1","point",{intro:"会社で、男の人と女の人が、先日のプレゼンについて話しています。",lines:[["F","この前のプレゼン、評判よかったね。"],["M","ありがとうございます。ただ、内容というより、質疑応答でうまく答えられなかったのが悔しくて。"],["F","あれは、想定外の質問だったからしかたないよ。"],["M","でも、想定しておくべきでした。次は、準備の段階で、もっと質問を洗い出しておきます。"]],ask:"男の人が悔しいと思っているのは、何ですか。",opts:["プレゼンの内容が悪かったこと","質疑応答でうまく答えられなかったこと","評判が悪かったこと","準備の時間が足りなかったこと"],ans:1,exp:"「内容というより、質疑応答でうまく答えられなかったのが悔しい」。「〜というより」把重點放在後者。"});
add("N1","point",{intro:"大学で、教授と学生が、留学について話しています。",lines:[["F","留学をやめたそうですが、何か問題でもありましたか。"],["M","費用の面も確かに心配でしたが、それは奨学金でなんとかなりそうだったんです。それより、帰国後の就職活動の時期と重なってしまうのがネックで。"],["F","なるほど。時期の問題ですか。"],["M","はい。一年遅れると、就職に不利になるかもしれないので。"]],ask:"男の学生が留学をやめた主な理由は何ですか。",opts:["費用が足りないから","奨学金がもらえなかったから","帰国後の就職活動に影響するから","語学力に自信がないから"],ans:2,exp:"費用可以用獎學金解決，真正的「ネック」是時期與就職活動重疊。"});
add("N1","point",{intro:"ラジオで、司会者と専門家が、ある商品の売れ行きについて話しています。",lines:[["F","この商品、発売直後は売れなかったのに、最近急に売れ始めたそうですね。"],["M","ええ。実は、広告を増やしたわけではないんです。ある有名人が、使っている様子をSNSに載せたのがきっかけです。"],["F","なるほど。広告の効果というより、口コミの力なんですね。"],["M","そのとおりです。"]],ask:"この商品が売れ始めたのは、なぜですか。",opts:["広告を増やしたから","値段を下げたから","有名人がSNSで紹介し、話題になったから","新しい機能がついたから"],ans:2,exp:"「広告を増やしたわけではない」，契機是有名人在SNS上傳使用情形（口コミ）。"});
add("N1","point",{intro:"会社で、二人が、会議の進め方について話しています。",lines:[["M","最近の会議、長くなりがちですよね。"],["F","ええ。発言が多いのが問題というより、結論を出さずに終わってしまうのが問題だと思うんです。"],["M","確かに。議題ごとに、決めることを最初に確認しておくだけでも違いそうですね。"],["F","そうですね。次回から提案してみます。"]],ask:"女の人は、会議の何が問題だと言っていますか。",opts:["発言が多すぎること","会議の回数が多いこと","結論が出ないまま終わること","資料が足りないこと"],ans:2,exp:"「発言が多いのが問題というより、結論を出さずに終わってしまうのが問題」。"});
add("N1","point",{intro:"病院で、医師と患者の男の人が話しています。",lines:[["F","手術をおすすめしますが、まずは薬で様子を見るという選択肢もあります。"],["M","手術は、できれば避けたいんです。ただ、仕事で長く休めないという事情もあって。"],["F","薬の場合は、通院は必要ですが、仕事を休む必要はありません。"],["M","それなら、まずは薬にします。症状が悪化したら、そのときに考え直します。"]],ask:"男の人が薬を選んだ主な理由は何ですか。",opts:["手術が怖いから","仕事を休まずに治療できるから","薬のほうが安いから","医師に勧められたから"],ans:1,exp:"「仕事を休む必要はありません」→男的最後選擇藥物。醫師其實推薦手術，所以「勧められたから」不對。"});
add("N1","gist",{intro:"大学の授業で、先生が話しています。",lines:[["F","「ブランド」と聞くと、高級品を思い浮かべる人が多いかもしれません。しかし、本来ブランドとは、消費者がその企業や商品に抱く、信頼や期待の総体を指します。つまり、価格の高低にかかわらず、一貫した品質や価値を提供し続けることで、はじめて築かれるものなのです。"]],ask:"話の要点は何ですか。",opts:["ブランドとは高級品のことである","ブランドは、一貫した価値の提供で築かれる信頼である","ブランドは価格で決まる","消費者はブランドに関心がない"],ans:1,exp:"定義：消費者の信頼・期待の総体；要件：一貫した品質・価値の提供。價格高低無關。"});
add("N1","gist",{intro:"ラジオで、男の人が話しています。",lines:[["M","「効率」を求めるあまり、私たちは、無駄に見えるものを切り捨てがちです。しかし、雑談や回り道が、思いがけない発見やアイデアにつながることも少なくありません。効率だけを追い求めるのではなく、ある程度の余白を持つことが、結果的に創造性を育むのではないでしょうか。"]],ask:"話し手の主張は何ですか。",opts:["効率を最優先すべきだ","雑談はやめるべきだ","ある程度の余白が創造性につながる","新しいアイデアは不要だ"],ans:2,exp:"主旨在最後的反問句：「ある程度の余白を持つことが、創造性を育む」。「〜のではないでしょうか」是委婉的主張。"});
add("N1","gist",{intro:"二人が、地方の過疎化について話しています。",lines:[["F","地方では、若者が都会に出ていく一方で、高齢者が残っていて、人口が減り続けているそうです。"],["M","ええ。でも最近は、リモートワークの普及で、地方に移住する人も増えているそうです。"],["F","とはいえ、仕事の選択肢が少ないという課題は、依然として残っていますよね。"],["M","そうですね。移住者を受け入れるだけでなく、地元で働ける環境づくりが鍵だと思います。"]],ask:"二人は、地方の課題について、どう考えていますか。",opts:["移住者が増えているので、問題は解決した","地元で働ける環境づくりが重要だと考えている","リモートワークは役に立たないと考えている","高齢者は都会へ移るべきだと考えている"],ans:1,exp:"雖有移居者增加，但就業選擇少仍是課題；男的結論是「地元で働ける環境づくりが鍵」。"});
add("N1","gist",{intro:"会社で、社長が社員に話しています。",lines:[["M","この一年、私たちは多くの困難に直面しました。しかし、皆さんの努力のおかげで、なんとか黒字を維持できました。来年は、さらに新しい分野に挑戦します。失敗を恐れず、チャレンジする姿勢を、ぜひ大切にしてほしいと思います。"]],ask:"社長が一番伝えたいことは何ですか。",opts:["来年は赤字になる","失敗を恐れずに挑戦してほしい","困難はもう終わった","社員を減らす"],ans:1,exp:"最後一句「失敗を恐れず、チャレンジする姿勢を大切に」是核心。前面是回顧與感謝。"});
add("N1","gist",{intro:"ニュースで、アナウンサーが伝えています。",lines:[["F","国内の観光地では、外国人観光客が増える一方、ごみのポイ捨てや騒音など、マナーの問題も指摘されています。自治体は、多言語の看板を設置するなど、ルールを分かりやすく伝える取り組みを始めました。"]],ask:"このニュースの内容として、正しいのはどれですか。",opts:["観光客が減っている","マナーの問題への対策として、ルールを分かりやすく伝え始めた","ごみの量が減った","外国人の入国が禁止された"],ans:1,exp:"觀光客增加的同時有垃圾與噪音問題，地方政府以多語言看板等「ルールを分かりやすく伝える」作為對策。"});
add("N1","integ",{intro:"会社で、課長と二人の部下が、新システムの導入について話しています。",lines:[["M","新しい勤怠管理システムの導入について、意見を聞かせてください。"],["F","私は賛成です。手入力のミスが減り、集計も早くなります。ただ、使い方に慣れるまで、研修が必要だと思います。"],["M2","僕は、導入には慎重です。費用が高いうえに、今のシステムでも、大きな問題は起きていません。費用に見合う効果があるのか疑問です。"],["M","なるほど。では、まず試験的に一つの部署で導入して、効果を確かめてから、全社に広げるというのはどうでしょう。"],["F","それなら、研修の負担も小さく済みますね。"],["M2","効果が数字で確認できるなら、納得できます。"]],ask:"三人の意見について、正しいのはどれですか。",opts:["女の人は慎重で、男の部下は賛成している","女の人は研修の必要性を指摘して賛成し、男の部下は費用対効果を疑問視している","三人とも反対している","三人とも、すぐ全社に導入すべきだと考えている"],ans:1,exp:"女：賛成＋研修が必要；男部下：費用對效果有疑問；課長提議「先在一個部門試行」。"});
add("N1","integ",{intro:"大学で、教授と二人の学生が、論文のテーマについて話しています。",lines:[["F","論文のテーマ、候補は決まりましたか。"],["M","はい、僕は、地域の祭りが人口流出に与える影響について調べたいです。ただ、定量的なデータが集めにくいのが課題です。"],["F2","私は、商店街の活性化の事例研究です。データは集まりやすいんですが、独自性が弱いと言われてしまいました。"],["F","なるほど。山田さんのテーマは独自性があるけれど、データが課題。鈴木さんは逆ですね。二人で情報を共有しながら進めてみては？"],["M","そうですね。アンケートの方法を相談させてください。"],["F2","私も、山田さんの視点を、事例に取り入れてみたいです。"]],ask:"二人の学生のテーマについて、正しいのはどれですか。",opts:["山田さんは独自性が強いがデータ集めが課題で、鈴木さんはデータは集めやすいが独自性が弱い","二人とも、データが集めやすい","二人とも、独自性が強い","山田さんは事例研究をしている"],ans:0,exp:"男（山田）：地域の祭り→独自性あり、データ難；女（鈴木）：商店街事例→データ易、独自性弱。教授也點出兩者「正好相反」。"});
add("N1","integ",{intro:"家族が、実家の相続について話しています。",lines:[["F","お母さんが住んでいた実家、どうしようか。選択肢は三つあるよね。売る、貸す、そのまま持っておく。"],["M","僕は売るのがいいと思う。管理の手間もかかるし、固定資産税も毎年かかるから。"],["F2","私は、できれば残したい。思い出もあるし。でも、遠くて管理できないのも事実なのよね。"],["F","貸すなら、管理は不動産会社に任せられるし、家賃収入で税金も払えるよ。"],["F2","それなら、家を残せるし、管理の心配も減るね。"],["M","売るより収入は少ないけど、家が残るのは悪くないか。じゃあ、貸す方向で、不動産会社に相談しよう。"]],ask:"三人は、どうすることにしましたか。",opts:["実家を売る","実家を貸す","実家をそのまま持っておく","実家を取り壊す"],ans:1,exp:"兄想賣、妹想留；折衷方案「貸す」：交給不動產公司管理、租金可付稅、房子保留。"});
add("N1","integ",{intro:"ラジオで、司会者と二人のゲストが、在宅勤務について話しています。",lines:[["F","在宅勤務の拡大について、お二人はどうお考えですか。"],["M","私は、基本的には歓迎です。通勤時間がなくなり、集中して仕事ができます。ただ、新人の教育には、対面のほうが向いていると感じます。"],["F2","私も賛成ですが、孤独を感じる社員が増えている点が気になります。雑談の機会が減ることで、チームの一体感が薄れる懸念があります。"],["M","確かに、それは課題ですね。週に一度は出社日を設けるなど、バランスが必要でしょう。"],["F2","ええ、その方向がいいと思います。"]],ask:"二人のゲストの意見として、正しいのはどれですか。",opts:["二人とも反対している","男の人は新人教育に、女の人は孤独や一体感に懸念を持っている","二人とも、完全な在宅勤務に賛成している","女の人は通勤時間を問題視している"],ans:1,exp:"男：新人教育は對面較適；女：孤獨・團隊一體感薄弱。兩人都基本贊成，並認同需有出社日。"});
add("N1","integ",{intro:"役所の説明会で、職員が三つの補助金について説明し、住民の二人が話しています。",lines:[["M","A補助金は、住宅の耐震工事の費用の半分を補助します。B補助金は、省エネ設備の設置費用を補助しますが、上限が十万円です。C補助金は、空き家の改修費用の三分の一です。"],["F","うちは築四十年なので、地震が心配です。"],["M2","うちは新築だから、省エネ設備の導入を考えています。ただ、十万円では足りないかな。"],["F","でも、補助があるだけありがたいじゃない。"],["M2","そうだね。上限があっても、使わないよりは得だ。"]],ask:"二人が利用を考えている補助金の組み合わせとして、正しいのはどれですか。",opts:["女の人はA、男の人はB","女の人はB、男の人はA","二人ともC","二人とも使わない"],ans:0,exp:"女：築四十年・擔心地震→A（耐震）；男：新築・省エネ→B（省エネ設備）。"});

add("N2","task",{intro:"会社で、リモートワーク中の女の人と課長が、オンラインで話しています。",lines:[["M","来週のオンライン会議、参加者は二十人くらいになりそうなんだ。"],["F","そうですか。資料は、事前に共有したほうがいいですよね。"],["M","うん。ただ、会議の中で画面共有もするから、操作に慣れている人に、司会をお願いしたい。"],["F","それなら、佐藤さんが適任だと思います。"],["M","じゃあ、佐藤さんに連絡してもらえる？ 資料の共有は、私がやるから。"],["F","承知しました。"]],ask:"女の人は、このあと、何をしますか。",opts:["資料を共有する","佐藤さんに連絡する","画面共有の練習をする","参加者を数える"],ans:1,exp:"課長說「佐藤さんに連絡してもらえる？ 資料の共有は私がやる」。所以女的要聯絡佐藤。"});
add("N2","task",{intro:"スーパーで、お客さんの女の人と店員が話しています。",lines:[["M","セルフレジのご利用は、初めてですか。"],["F","はい。使い方がよくわからなくて。"],["M","まず、商品のバーコードを、機械に読み取らせてください。そのあと、ご自分の袋に入れていただいて、最後に、お支払いの方法を選びます。"],["F","袋は、持ってきたんですが、レジ袋はいりません。"],["M","それでしたら、画面で『袋なし』を選んでください。それから、商品の読み取りを始めてください。"]],ask:"女の人は、まず何をしますか。",opts:["商品を袋に入れる","支払いの方法を選ぶ","画面で袋なしを選ぶ","店員を呼ぶ"],ans:2,exp:"一般流程是掃描→裝袋→付款，但這位客人不要塑膠袋，店員要她「まず『袋なし』を選んでください」。"});
add("N2","task",{intro:"会社で、男の人と先輩の女の人が、経費の精算について話しています。",lines:[["M","先輩、出張の交通費の精算、どうすればいいですか。"],["F","今は、紙じゃなくて、システムで申請するんだよ。まず、領収書を写真に撮って、アップロードして。"],["M","はい。金額は、手入力ですか。"],["F","自動で読み取られるけど、間違っていることもあるから、必ず、確認してから提出してね。"],["M","わかりました。"]],ask:"男の人は、まず何をしますか。",opts:["金額を確認する","領収書を写真に撮る","紙の用紙に記入する","申請を提出する"],ans:1,exp:"順序：①拍收據→上傳 ②確認金額 ③提出。所以最先是「領収書を写真に撮る」。"});
add("N2","point",{intro:"会社で、二人が話しています。",lines:[["F","副業を始めたそうですね。お金のためですか。"],["M","それも少しはありますが、実は、今の仕事では身につかないスキルを、学びたかったんです。"],["F","なるほど。収入を増やしたいわけじゃないんですね。"],["M","ええ。むしろ、経験が目的です。"]],ask:"男の人が副業を始めた一番の理由は何ですか。",opts:["収入を増やしたいから","新しいスキルを身につけたいから","今の会社が嫌だから","時間が余っているから"],ans:1,exp:"「今の仕事では身につかないスキルを学びたかった」才是主因，「収入を増やしたいわけじゃない」被否定。"});
add("N2","point",{intro:"電話で、お客さんと通販サイトの担当者が話しています。",lines:[["F","先週注文した商品が、まだ届いていないんですが。"],["M","申し訳ございません。確認いたします。…配送業者の記録を見ると、一度、お留守で持ち帰られているようです。"],["F","えっ、その日は家にいたのに、連絡は何もなかったです。"],["M","不在票が入っていなかったのでしょうか。再配達の手配をいたします。"]],ask:"荷物が届かなかった原因は何ですか。",opts:["商品が品切れだったから","配送業者が不在と判断して持ち帰ったから","住所が間違っていたから","注文が届いていなかったから"],ans:1,exp:"配送記錄顯示「お留守で持ち帰られた」，但客人明明在家，因此是配送端誤判不在。"});
add("N2","point",{intro:"大学で、男の学生と女の学生が話しています。",lines:[["F","オンライン授業と、教室での授業、どっちが好き？"],["M","通学の時間が要らないのは楽だけど、僕は、対面のほうがいいな。質問しやすいし、友達もできるから。"],["F","そうなんだ。私は、自分のペースで見返せるから、オンラインが好きだけどね。"]],ask:"男の学生が、対面授業のほうがいいと言う理由は何ですか。",opts:["通学が楽だから","質問しやすく、友達もできるから","自分のペースで学べるから","授業が短いから"],ans:1,exp:"男：質問しやすい・友達もできる；女才是「自分のペースで見返せる」。"});
add("N2","gist",{intro:"ラジオで、女の人が話しています。",lines:[["F","最近、物価の上昇で、家計が苦しいという声をよく聞きます。そこで、食費を抑えるために、まとめ買いや、冷凍保存を活用する家庭が増えています。ただ、安さだけで選ぶと、栄養が偏ることもあります。節約と健康のバランスが、大切になってきています。"]],ask:"この話の要点は何ですか。",opts:["節約するときは、健康とのバランスも大切だ","食費は減らせない","冷凍食品は体に悪い","物価はもうすぐ下がる"],ans:0,exp:"整體在說物價上漲下的節約；結論是「節約と健康のバランスが大切」。"});
add("N2","gist",{intro:"大学の授業で、先生が話しています。",lines:[["M","SNSで、誤った情報が拡散される問題が、深刻になっています。多くの人は、内容を確かめずに、共有してしまいます。情報を発信する前に、出どころを確認し、複数の情報源を比べる習慣が、これからはますます重要になるでしょう。"]],ask:"先生が一番伝えたいことは何ですか。",opts:["SNSは使うべきではない","情報を共有する前に、出どころを確認すべきだ","誤った情報はすぐに消える","人は情報を信じやすい"],ans:1,exp:"結論：發出前先確認出處、比較多個來源。"});
add("N2","gist",{intro:"会社で、二人が新しい制度について話しています。",lines:[["F","来月から、勤務時間が選べるようになるそうですね。"],["M","ええ。子育て中の人には、助かる制度でしょうね。ただ、チームで仕事をする部署では、全員が揃う時間が減って、調整が大変になるかもしれません。"],["F","確かに。使い方のルールを決めておかないと、混乱しそうですね。"]],ask:"二人は、この制度について、どう考えていますか。",opts:["利点はあるが、使い方のルール作りが必要だ","制度に完全に反対している","制度の内容を知らない","問題は何もない"],ans:0,exp:"利點（對育兒者有幫助）＋隱憂（調整困難）→結論是需要事先訂規則。"});
add("N2","gist",{intro:"ニュースで、アナウンサーが伝えています。",lines:[["F","国内では、ネットで買い物をする人が年々増えていますが、それに伴い、荷物を受け取れない再配達の問題が、深刻になっています。宅配ボックスの設置や、コンビニでの受け取りなど、再配達を減らす工夫が広がっています。"]],ask:"このニュースの内容として、正しいのはどれですか。",opts:["再配達を減らす工夫が広がっている","ネットで買い物する人が減っている","宅配ボックスは使われていない","コンビニは受け取りができない"],ans:0,exp:"網購增加→再配送問題→宅配箱與便利商店取貨等對策擴大。"});
add("N2","integ",{intro:"家族三人が、動画配信サービスの契約について話しています。",lines:[["F","動画配信のサービス、Aは月九百円で、広告つき。Bは月千五百円で、広告なしで、四人まで同時に見られるよ。"],["M","うちは三人家族だけど、同時に見ることは、あまりないな。"],["F2","でも、広告があると、見ていて気が散るのよね。"],["M","確かに。それなら、三百円の差で、広告がないほうがいいか。"],["F","じゃあ、Bにしましょう。"]],ask:"家族は、どうしてBを選びましたか。",opts:["同時に見る人が多いから","広告がなく、差額も小さいから","Bのほうが安いから","動画が増えたから"],ans:1,exp:"同時觀看不是理由（男的說很少）。決定因素是「広告がなくて、三百円の差」。"});
add("N2","integ",{intro:"会社で、三人が、社員旅行を中止するかどうかについて話しています。",lines:[["F","今年の社員旅行、どうしましょうか。参加希望者が、半分くらいしかいなくて。"],["M","費用を考えると、中止にするのも仕方ないかな。"],["F2","でも、せっかくの交流の機会ですから、日帰りの小さなイベントに変えるのはどうでしょう。"],["F","それなら、費用も抑えられるし、参加しやすそうですね。"],["M","なるほど。日帰りなら、予定の調整も楽だし、そうしよう。"]],ask:"三人は、どうすることにしましたか。",opts:["旅行を予定どおり行う","旅行を中止して何もしない","日帰りの小さなイベントにする","参加者を減らして行く"],ans:2,exp:"折衷方案：改成「日帰りの小さなイベント」，費用低、易參加。"});
add("N2","integ",{intro:"不動産会社で、お客さんの夫婦と店員が、物件について話しています。",lines:[["M","Aのマンションは駅から近いですが、築二十年で、家賃は十万円です。Bは、駅から遠いですが、新築で、家賃は九万円です。"],["F","うちは二人とも、在宅勤務が多いから、駅の近さはあまり関係ないよね。"],["M2","そうだね。それより、仕事部屋が必要だから、部屋数が大事だな。Bは、部屋が一つ多いんですか。"],["M","はい、Bは二LDK、Aは一LDKです。"],["F","じゃあ、Bで決まりだね。"]],ask:"二人が、Bを選んだ理由は何ですか。",opts:["駅から近いから","在宅勤務が多く、仕事部屋になる部屋があるから","Aが高すぎるから","新しい部屋が好きだから"],ans:1,exp:"在家工作多→車站遠近無所謂；需要工作間→B有多一間房。"});

add("N1","task",{intro:"大学で、教授と女の学生が、インタビュー調査について話しています。",lines:[["M","インタビューの文字起こし、AIの自動ツールで作ったそうだね。"],["F","はい。時間が大幅に短縮できました。ただ、専門用語の誤りが、いくつかありました。"],["M","研究に使うデータだから、そこは慎重にね。まず、誤りを手作業で直して、そのあと、協力者に内容の確認を取ってください。"],["F","わかりました。協力者の確認は、直したあとですね。"]],ask:"女の学生は、まず何をしますか。",opts:["協力者に確認を取る","専門用語の誤りを手作業で直す","別のツールを探す","インタビューをやり直す"],ans:1,exp:"順序：①手作業で誤りを修正 ②協力者に確認。第一步是修正。"});
add("N1","task",{intro:"役所で、男の人と職員の女の人が、手続きについて話しています。",lines:[["F","マイナンバーカードの更新ですね。電子証明書の有効期限が近づいていますので、更新が必要です。"],["M","手続きは、今日、窓口でできますか。"],["F","はい。ただ、暗証番号の入力が必要です。お忘れの場合は、再設定の手続きが先になります。"],["M","実は、数字を忘れてしまったんです。"],["F","それでしたら、まず、こちらの用紙で再設定の申請をしてください。"]],ask:"男の人は、まず何をしますか。",opts:["電子証明書を更新する","暗証番号の再設定を申請する","マイナンバーカードを作る","窓口で待つ"],ans:1,exp:"忘記密碼→「再設定の手続きが先」，所以先填表申請重設。"});
add("N1","point",{intro:"会社で、二人が話しています。",lines:[["F","新しい生成AIのツール、結局、使わなくなっちゃったんですか。"],["M","最初は便利だと思ったんですが、出てきた内容が正しいかどうかを、自分で調べ直さなきゃいけなくて、かえって時間がかかるんです。"],["F","なるほど。性能が悪いわけじゃないんですね。"],["M","ええ。確認の手間が、ネックなんです。"]],ask:"男の人がツールを使わなくなった理由は何ですか。",opts:["性能が悪いから","使い方が難しいから","内容の確認に手間がかかるから","料金が高いから"],ans:2,exp:"「確認の手間がネック」。「性能が悪いわけじゃない」被否定。"});
add("N1","point",{intro:"ラジオで、司会者と専門家が、商店街の活性化について話しています。",lines:[["F","この商店街、最近、賑わいを取り戻したそうですね。"],["M","ええ。大型の施設ができたわけではないんです。若い経営者が、SNSで、一軒ずつ、店の魅力を発信し始めたのがきっかけでした。"],["F","つまり、広告より、個人の発信が効いたと。"],["M","そうですね。"]],ask:"商店街が賑わいを取り戻した理由は何ですか。",opts:["大型施設ができたから","若い経営者がSNSで発信したから","家賃が安くなったから","観光客が減ったから"],ans:1,exp:"「大型の施設ができたわけではない」，契機是年輕老闆在SNS上逐一介紹店家。"});
add("N1","point",{intro:"大学で、教授と学生が、進路について話しています。",lines:[["F","大学院に進むのをやめて、就職することにしたそうですね。"],["M","研究は好きなんですが、研究室の雰囲気や、先輩の様子を見て、将来、研究者として食べていくのは、現実的に厳しいなと感じたんです。"],["F","経済的な不安があった、と。"],["M","ええ、それが一番の理由です。"]],ask:"男の学生が就職を選んだ一番の理由は何ですか。",opts:["研究が嫌いになったから","研究者として生活していく不安があるから","研究室の人と合わないから","就職したい会社があるから"],ans:1,exp:"「研究者として食べていくのは現実的に厳しい」＝生活的不安，被確認為「一番の理由」。"});
add("N1","gist",{intro:"ラジオで、女の人が話しています。",lines:[["F","「生成AIが、仕事を奪う」という議論が盛んですが、私は、仕事そのものより、仕事の進め方が変わると考えています。単純な作業はAIに任せ、人間は、判断や、人との関係づくりに力を注ぐ。そうした役割分担が、今後は当たり前になっていくのではないでしょうか。"]],ask:"話し手の主張は何ですか。",opts:["AIは仕事を完全に奪う","AIとの役割分担で、仕事の進め方が変わっていく","AIは使うべきではない","人間の判断は不要になる"],ans:1,exp:"主旨：不是被搶走，而是「仕事の進め方が変わる」＝與AI分工。"});
add("N1","gist",{intro:"大学の授業で、先生が話しています。",lines:[["M","ふるさと納税は、自分の選んだ自治体に寄付をすると、税金が控除される制度です。地方を応援できるうえ、返礼品がもらえることから、人気が広がりました。しかし、返礼品の競争が過熱し、本来の目的である、地域の支援から離れているという批判もあります。"]],ask:"この話の要点は何ですか。",opts:["制度は人気だが、本来の目的から外れているという批判もある","制度は廃止された","返礼品は無料で配られる","自治体は寄付を断っている"],ans:0,exp:"先說明制度與人氣，後用「しかし」帶出批評：競爭過熱、偏離本來目的。"});
add("N1","gist",{intro:"二人が、働き方について話しています。",lines:[["F","最近、副業を認める会社が増えているそうですね。"],["M","ええ。会社の側にも、社員が外で得た経験を、本業に生かしてほしいという狙いがあるようです。"],["F","とはいえ、本業がおろそかになるのではないかという心配もありますよね。"],["M","そこは、ルール作りと、本人の自己管理に頼るところが大きいでしょうね。"]],ask:"二人は、副業について、どう考えていますか。",opts:["利点はあるが、本業との両立には課題がある","副業は完全に禁止すべきだ","副業は何の効果もない","副業は会社にとって損だ"],ans:0,exp:"利點（經驗回饋本業）＋疑慮（本業疏忽）＋結論：靠規則與自我管理。"});
add("N1","gist",{intro:"ニュースで、アナウンサーが伝えています。",lines:[["F","物価の上昇を受けて、企業の間で、賃金を引き上げる動きが広がっています。一方で、中小企業では、価格に転嫁できず、賃上げに踏み切れない例も目立ちます。専門家は、取引価格の適正化が課題だと指摘しています。"]],ask:"このニュースの内容として、正しいのはどれですか。",opts:["すべての企業が賃上げできている","中小企業では賃上げが難しい例もあり、価格の適正化が課題とされている","物価は下がっている","専門家は賃上げに反対している"],ans:1,exp:"大企業傾向加薪，但中小企業難以轉嫁成本；專家指出「取引価格の適正化」是課題。"});
add("N1","integ",{intro:"会社で、三人が、新しい資料作成の方法について話しています。",lines:[["M","資料の下書きをAIに作らせる案が出ています。皆さんの意見を聞かせてください。"],["F","効率は上がると思います。ただ、内容に誤りがあった場合の責任の所在が、あいまいになるのが気になります。"],["M2","僕は、機密情報が外部に漏れるリスクのほうが心配です。社内で安全に使える環境が整うまでは、様子を見るべきだと思います。"],["M","なるほど。では、まず、機密を含まない資料に限って、試験的に使ってみるのはどうでしょう。"],["F","それなら、責任の範囲も、はっきりさせやすいですね。"],["M2","その範囲なら、リスクも小さいですね。"]],ask:"三人の意見について、正しいのはどれですか。",opts:["女の人は責任の所在を、男の部下は情報漏えいを心配している","二人とも、導入に全面的に賛成している","男の部下は効率に問題があると言っている","三人とも、導入しないことにした"],ans:0,exp:"女：責任の所在があいまい；男部下：機密漏えいのリスク；課長：機密を含まない資料に限って試験導入。"});
add("N1","integ",{intro:"夫婦が、住宅の購入について、不動産会社の説明を聞いたあと、話しています。",lines:[["F","Aは都心の中古マンションで、価格は五千万円。駅から近くて、将来、売りやすいです。Bは郊外の新築一戸建てで、四千万円。広くて、庭もあります。"],["M","僕は、在宅勤務が多いから、広さのあるBがいいな。"],["F2","でも、通勤が週に一度でも、郊外だと、何かと不便じゃない？ 子どもの学校も、遠くなるし。"],["M","それは、確かに。ただ、価格の差も大きいから、将来のローンを考えると、Bのほうが現実的かな。"],["F2","そうね。学校については、調べてみてから、最終的に決めましょう。"]],ask:"二人の意見の説明として、正しいのはどれですか。",opts:["男の人は広さと価格を重視し、女の人は通勤や学校を心配している","二人とも、Aに決めた","女の人は広さを重視している","男の人は、駅の近さを重視している"],ans:0,exp:"男：在宅多，重視寬敞與價差（B）；女：通勤與孩子學校不便（偏A）。最後決定先調查學校。"});
add("N1","integ",{intro:"ラジオ番組で、司会者と二人のゲストが、オンライン教育について話しています。",lines:[["F","オンライン教育の広がりについて、お二人のご意見を伺います。"],["M","私は、地方の学生にも、質の高い授業が届くという点で、大きな意義があると思います。ただ、学生同士の交流が減るのが課題です。"],["F2","私も意義は認めますが、集中力を保つのが難しい学生が多い点を、重く見ています。教える側の工夫が必要です。"],["M","そうですね。交流の場づくりと、授業の工夫、両方が必要でしょう。"]],ask:"二人のゲストの意見として、正しいのはどれですか。",opts:["男の人は交流の減少を、女の人は集中力の維持を、課題と考えている","二人とも、オンライン教育に反対している","男の人は集中力を、女の人は交流を課題としている","二人とも、課題はないと考えている"],ans:0,exp:"男：学生同士の交流が減る；女：集中力の維持が難しい。兩人都認同意義。"});

add("N3","gist",{intro:"市の防災放送です。",lines:[["M","市民の皆様にお知らせします。市内の山に近い地域で、クマの目撃情報が相次いでいます。夕方から朝にかけては、特に注意してください。やむを得ず外出するときは、鈴やラジオなど、音の出るものを身につけてください。"]],ask:"この放送は、何を呼びかけていますか。",opts:["クマに注意して、音の出るものを持つこと","山に登ってはいけないこと","ごみを出さないこと","夜に外出してはいけないこと"],ans:0,exp:"重點：有熊出沒，傍晚到早上要特別注意，外出時帶鈴鐺或收音機等會出聲的東西。"});
add("N3","gist",{intro:"ラジオの天気予報です。",lines:[["F","今週末は、強い寒気が流れ込み、広い範囲で、今シーズン一番の冷え込みになるでしょう。朝晩は、氷が張るところもありそうです。風邪をひかないよう、暖かくしてお過ごしください。"]],ask:"この予報のポイントは何ですか。",opts:["今週末は、今シーズン一番寒くなること","週末は雨が続くこと","気温が上がること","台風が近づいていること"],ans:0,exp:"關鍵是「今シーズン一番の冷え込み」（今季最冷）。"});
add("N3","gist",{intro:"ニュースで、アナウンサーが伝えています。",lines:[["F","三連休の最終日の今日、各地の観光地は、多くの人でにぎわいました。高速道路では、朝から渋滞が続き、夕方には、帰りの車で、混雑のピークを迎えました。"]],ask:"このニュースは、何について伝えていますか。",opts:["連休最終日の混雑","道路の工事","新しい観光地","天気の変化"],ans:0,exp:"說的是三連休最後一天的混雜（觀光地與高速公路塞車）。"});
add("N3","point",{intro:"会社で、男の人と女の人が話しています。",lines:[["F","インフルエンザの予防接種、もう受けた？"],["M","まだなんだ。毎年受けてるけど、今年は忙しくて、病院に行く時間がなくて。"],["F","会社の近くのクリニックなら、夜八時まで受け付けてるよ。"],["M","そうなんだ。じゃあ、仕事のあとに行ってみる。"]],ask:"男の人は、どうして予防接種を受けていませんか。",opts:["注射が嫌いだから","病院に行く時間がないから","費用が高いから","もう受けたから"],ans:1,exp:"「忙しくて、病院に行く時間がなくて」是原因。"});
add("N3","point",{intro:"町内会で、男の人と女の人が話しています。",lines:[["M","来月の防災訓練、参加できそうですか。"],["F","参加したいんですが、その日は、子どもの運動会と重なっていて。"],["M","そうですか。訓練は午前中だけなので、午後からの運動会なら、間に合うかもしれませんよ。"],["F","運動会は朝からなんです。残念ですが、今回は見送ります。"]],ask:"女の人は、どうして訓練に参加しませんか。",opts:["訓練に興味がないから","運動会が朝からあるから","体調が悪いから","仕事があるから"],ans:1,exp:"運動會從早上開始，與上午的訓練時間衝突，所以「今回は見送ります」。"});
add("N3","task",{intro:"町内会の集まりで、男の人と女の人が話しています。",lines:[["M","来週のごみ拾いの活動なんですが、手袋とごみ袋は、こちらで用意します。"],["F","わかりました。私は、何を準備すればいいですか。"],["M","動きやすい服と、飲み物をお願いします。それと、集合場所の公園まで、できれば歩いて来てください。駐車場がないので。"],["F","はい、わかりました。"]],ask:"女の人は、何を準備しますか。",opts:["手袋とごみ袋","動きやすい服と飲み物","車","活動の道具"],ans:1,exp:"手套和垃圾袋由對方準備；女的要準備「動きやすい服と飲み物」。"});
add("N3","task",{intro:"市役所で、女の人と職員が話しています。",lines:[["M","粗大ごみを出したいんですが、どうすればいいですか。"],["F","まず、電話かインターネットで、収集の予約をしてください。そのあと、コンビニで、処理券を買って、ごみに貼ります。"],["M","処理券は、先に買うんですか。"],["F","いえ、予約が終わってからです。料金が決まりますので。"]],ask:"男の人は、まず何をしますか。",opts:["処理券を買う","収集の予約をする","ごみに券を貼る","コンビニに行く"],ans:1,exp:"順序：①預約收集 ②買處理券 ③貼在垃圾上。第一步是預約。"});
add("N2","gist",{intro:"ニュースで、アナウンサーが伝えています。",lines:[["F","観光客が急増している地域で、住民の生活への影響が懸念されています。バスが混雑して通勤に支障が出たり、ごみの出し方に問題が生じたりしているためです。一部の自治体では、観光客と住民の双方に配慮した対策の検討を始めています。"]],ask:"このニュースの内容として、最も適当なものはどれですか。",opts:["観光客の増加による、住民生活への影響が問題になっている","観光客が減って困っている","観光客だけを優先する対策が決まった","バスの料金が下がった"],ans:0,exp:"觀光客暴增→巴士擁擠、垃圾問題→地方政府開始檢討對策（兼顧居民與遊客）。"});
add("N2","gist",{intro:"ラジオで、専門家が話しています。",lines:[["M","空き家の増加は、全国的な課題です。放置された空き家は、防犯や景観の面で問題になるだけでなく、倒壊の危険もあります。自治体は、解体の費用を補助するなど、対応を進めていますが、所有者が見つからないケースも多く、解決は簡単ではありません。"]],ask:"話し手が述べていることは何ですか。",opts:["空き家問題への対応は進んでいるが、解決は容易ではない","空き家は減っている","空き家は問題ではない","自治体は何も対策をしていない"],ans:0,exp:"說明問題與對策（補助拆除），再以「ただ／しかし」類轉折：所有人找不到，不易解決。"});
add("N2","gist",{intro:"ニュース番組で、キャスターが話しています。",lines:[["M","インターネット上の誹謗中傷が、社会問題になっています。匿名であることを理由に、他人を傷つける言葉を平気で書き込む人がいる一方で、被害を受けた人が、相談できる窓口は、まだ十分とは言えません。専門家は、法整備に加えて、教育の重要性を指摘しています。"]],ask:"このニュースの要点は何ですか。",opts:["ネット上の中傷は問題で、法整備と教育が必要だと指摘されている","匿名で書き込むことは許可された","被害の相談窓口は十分にある","中傷は減っている"],ans:0,exp:"問題（誹謗中傷）＋窗口不足＋專家指出法規與教育並重。"});
add("N2","point",{intro:"ニュースで、アナウンサーが伝えています。",lines:[["F","今月、各地で、コメの価格が上がっています。主な理由は、収穫量が減ったことではなく、需要が増えて、在庫が少なくなっていることだと、農家の団体は説明しています。"]],ask:"価格が上がっている主な理由は何ですか。",opts:["収穫量が減ったから","需要が増えて、在庫が少なくなったから","輸出が減ったから","農家が減ったから"],ans:1,exp:"「収穫量が減ったことではなく」被否定，主因是需求增加、庫存減少。"});
add("N2","point",{intro:"会社で、二人が、ニュースを見ながら話しています。",lines:[["F","この会社、来年から、四日勤務に切り替えるそうですよ。"],["M","給料は変わらないんですか。"],["F","ええ。社員の健康と、人材の確保が目的だそうです。優秀な人は、働きやすさを重視しますから。"],["M","なるほど。確保が狙いなんですね。"]],ask:"会社が四日勤務にする目的は何ですか。",opts:["コストを減らすため","社員の健康と人材確保のため","売り上げを上げるため","仕事を減らすため"],ans:1,exp:"目的：「社員の健康と、人材の確保」。"});
add("N2","point",{intro:"駅で、アナウンスが流れています。",lines:[["F","ご案内いたします。ただいま、線路内に、動物が入ったため、安全の確認を行っております。そのため、この電車は、運転を見合わせております。再開は、三十分後を見込んでおります。"]],ask:"電車が止まっている理由は何ですか。",opts:["信号の故障","線路に動物が入ったから","大雨のため","人身事故"],ans:1,exp:"「線路内に、動物が入ったため」。再開預計三十分後。"});
add("N2","task",{intro:"会社で、広報の女の人と課長が、取材の対応について話しています。",lines:[["M","明日、新聞社の取材が入ったよ。新商品について、担当者に話を聞きたいそうだ。"],["F","担当者は、山田さんですね。何を準備しておけばいいでしょうか。"],["M","想定される質問と、その答えを、まとめておいてくれる？ それを、山田さんに共有して、確認してもらおう。"],["F","わかりました。会議室の予約は、どうしましょう。"],["M","それは、私がやっておくよ。"]],ask:"女の人は、まず何をしますか。",opts:["会議室を予約する","想定質問と答えをまとめる","山田さんに確認してもらう","取材を断る"],ans:1,exp:"順序：①整理預期提問與答案 ②共享給山田 ③確認。會議室由課長處理。"});
add("N2","task",{intro:"病院で、受付の女の人と男の人が話しています。",lines:[["F","初診の方は、こちらの問診票に記入してください。お薬を飲んでいる場合は、お薬手帳もお願いします。"],["M","お薬手帳は、持ってきていないんですが。"],["F","でしたら、飲んでいるお薬の名前を、問診票に書いてください。わからない場合は、あとで、薬局で確認していただいても結構です。"],["M","じゃあ、わかる範囲で書きます。"]],ask:"男の人は、まず何をしますか。",opts:["お薬手帳を取りに帰る","問診票に記入する","薬局に行く","受付で待つ"],ans:1,exp:"沒帶藥袋手冊也可以，先填問診票，把知道的藥名寫上。"});
add("N1","gist",{intro:"ニュース解説で、専門家が話しています。",lines:[["M","人口減少が進む中、地方の自治体では、行政サービスの維持が大きな課題となっています。医療や交通、教育といった、住民の生活基盤を、これまでと同じ規模で保つことは、財政的に難しくなっています。そこで、近隣の自治体と連携して、サービスを共同で運営する動きが出始めています。"]],ask:"話の要点は何ですか。",opts:["人口減少で、行政サービスの維持が難しく、自治体の連携が進み始めている","地方の人口は増えている","自治体は連携を禁止された","行政サービスは不要になった"],ans:0,exp:"人口減少→服務難以維持→鄰近自治體合作營運（連携）。"});
add("N1","gist",{intro:"経済番組で、アナリストが話しています。",lines:[["F","円安が長引く中、輸入品の価格が上昇し、家計への負担が増しています。賃金の上昇が、物価の上昇に追いついていないという指摘も多く、実質的な購買力は低下していると言えるでしょう。この状況が続けば、消費の冷え込みが懸念されます。"]],ask:"アナリストは、どのような状況を指摘していますか。",opts:["賃金が物価に追いついておらず、消費の冷え込みが懸念される","円高が続いていること","賃金が大幅に上がったこと","輸入品が安くなったこと"],ans:0,exp:"日圓貶值→進口品漲價；薪資追不上物價→實質購買力下降→擔憂消費冷卻。"});
add("N1","gist",{intro:"大学の授業で、先生が話しています。",lines:[["F","生成AIが作る文章や画像の著作権は、どのように扱われるべきでしょうか。AIが学習に使ったデータの権利者への配慮と、AIを使って創作する人の権利。この二つの間で、国際的にも議論が続いています。結論を急ぐのではなく、技術の進歩に合わせて、柔軟に見直していく姿勢が求められるでしょう。"]],ask:"先生が述べていることは何ですか。",opts:["著作権は、技術の進歩に合わせて、柔軟に見直す必要がある","AIの著作権は完全に解決した","AIの使用は禁止すべきだ","著作権は不要だ"],ans:0,exp:"論點：權利人與創作者兩方權利難以兼顧；結論是「柔軟に見直していく姿勢」。"});
add("N1","point",{intro:"ラジオで、司会者と専門家が話しています。",lines:[["F","高齢ドライバーの免許返納が、なかなか進まないのはなぜでしょうか。"],["M","事故への不安はあっても、車がないと、買い物や通院ができない地域が多いからです。返納を促すだけでは不十分で、代わりの移動手段を、確保する必要があります。"],["F","つまり、意識の問題というより、環境の問題なんですね。"],["M","そのとおりです。"]],ask:"免許返納が進まない主な理由は何ですか。",opts:["高齢者が事故を恐れないから","車がないと生活できない地域が多いから","返納の手続きが複雑だから","車に愛着があるから"],ans:1,exp:"「意識の問題というより、環境の問題」＝代替交通手段不足才是原因。"});
add("N1","point",{intro:"会社で、二人が、ニュースについて話しています。",lines:[["M","あの会社、不祥事のあと、売り上げが落ち込んでいるみたいですね。"],["F","ええ。問題そのものより、対応の遅さと、説明が不十分だったことが、信頼を失う原因になったと言われています。"],["M","初動が大事だということですね。"]],ask:"信頼を失った主な原因は何ですか。",opts:["問題が起きたこと","対応が遅く、説明が不十分だったこと","社員が辞めたこと","広告を出さなかったこと"],ans:1,exp:"「問題そのものより、対応の遅さと説明不足」＝信任流失的主因。"});
add("N1","integ",{intro:"討論番組で、司会者と二人のゲストが、外国人材の受け入れについて話しています。",lines:[["F","外国人材の受け入れ拡大について、ご意見を伺います。"],["M","私は、人手不足を補ううえで、不可欠だと考えます。ただ、日本語教育や住環境の支援が、まだ不十分で、そこが課題です。"],["F2","私も賛成ですが、地域の中で、孤立してしまう人が少なくない点を、重く見ています。受け入れる側の理解も、同時に深めるべきでしょう。"],["M","確かに、支援は、外国人本人だけでなく、地域全体の問題として考える必要がありますね。"]],ask:"二人のゲストの意見として、正しいのはどれですか。",opts:["男の人は支援体制の不足を、女の人は孤立と地域の理解を課題としている","二人とも受け入れに反対している","男の人は孤立を、女の人は日本語教育だけを課題としている","二人とも課題はないと考えている"],ans:0,exp:"男：日語教育・住環境支援不足；女：孤立，需要地區居民理解。兩人皆贊成受け入れ。"});
add("N1","integ",{intro:"ラジオ番組で、司会者と二人の専門家が、再生可能エネルギーについて話しています。",lines:[["F","再生可能エネルギーの拡大について、お二人はどうお考えですか。"],["M","私は、早急に拡大すべきだと考えます。気候変動への対応は、待ったなしですから。ただ、送電網の整備が追いついておらず、そこがボトルネックです。"],["F2","私は、拡大には賛成ですが、地域の景観や環境への影響にも、十分に配慮すべきだと思います。住民との合意形成が、欠かせません。"],["M","おっしゃるとおりです。インフラの整備と、地域との対話、両方が必要でしょう。"]],ask:"二人の専門家の意見として、正しいのはどれですか。",opts:["男の人は送電網の整備を、女の人は住民との合意形成を重視している","二人とも拡大に反対している","男の人は景観を、女の人は送電網を重視している","二人とも、課題はないと考えている"],ans:0,exp:"男：送電網（ボトルネック）；女：景觀／環境與居民共識。兩者最後都同意兩方面並進。"});
add("N1","integ",{intro:"役所の説明会で、職員が二つの移住支援制度を説明し、住民の二人が話しています。",lines:[["M","A制度は、移住後三年間、家賃を補助します。B制度は、地元で起業する人に、開業資金を補助します。"],["F","私は、在宅で仕事ができるので、まず、生活費が安定するほうがありがたいです。"],["M2","僕は、地元の特産品を使った店を開きたいんです。初期費用が一番の壁なので。"],["F","それなら、お二人は、別の制度ですね。"],["M2","そうですね。"]],ask:"二人が利用を考えている制度の組み合わせとして、正しいのはどれですか。",opts:["女の人はA、男の人はB","女の人はB、男の人はA","二人ともA","二人ともB"],ans:0,exp:"女：在宅工作→想要生活費穩定→A（房租補助）；男：想開店→初期費用→B（開業資金）。"});

/* ============================================================
   音聲引擎（OpenAI TTS + WebAudio + 本機快取）
   ============================================================ */
let ctx=null,active=[],playToken=0;
const SILENT="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAAAA";
function actx(){if(!ctx){const C=window.AudioContext||window.webkitAudioContext;ctx=new C()}return ctx}
function kick(){ // 必須在使用者點擊的同一個事件裡呼叫（解除 Safari / iOS 的自動播放限制）
  try{const c=actx();if(c.state==="suspended")c.resume()}catch(e){}
  try{const a=new Audio(SILENT);a.play().catch(()=>{})}catch(e){}
}
async function ensureRunning(){const c=actx();if(c.state!=="running"){try{await Promise.race([c.resume(),sleep(500)])}catch(e){}}return c.state==="running"}
function stopSrc(){active.forEach(s=>{try{s.stop()}catch(e){}});active=[]}

const mem=new Map();let dbp=null;
function idb(){if(dbp)return dbp;dbp=new Promise(res=>{try{if(!window.indexedDB)return res(null);const r=indexedDB.open("jq-audio",1);r.onupgradeneeded=()=>r.result.createObjectStore("a");r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});return dbp}
async function cget(k){if(mem.has(k))return mem.get(k);const d=await idb();if(!d)return null;return new Promise(res=>{try{const q=d.transaction("a").objectStore("a").get(k);q.onsuccess=()=>{if(q.result)mem.set(k,q.result);res(q.result||null)};q.onerror=()=>res(null)}catch(e){res(null)}})}
async function cset(k,v){mem.set(k,v);const d=await idb();if(!d)return;try{d.transaction("a","readwrite").objectStore("a").put(v,k)}catch(e){}}
const ckey=(who,lv,t)=>who+"|"+lv+"|"+(S.set.slow?1:0)+"|"+t;

function instr(who,lv){
  const tone=S.set.slow?"かなりゆっくり、一語一語をはっきりと":LVTONE[lv];
  const extra=who==="N"?"感情を込めすぎず、試験の放送のように淡々と。":"読み上げ口調ではなく、自然な会話のイントネーションで。";
  return "日本語のネイティブスピーカーとして、"+tone+"話してください。話し手は"+ROLE[who]+"です。"+extra;
}
async function ttsRequest(text,who,lv){
  const k=ckey(who,lv,text);
  const hit=await cget(k);if(hit)return hit;
  const pref=S.set.ttsPref;
  let order=pref==="hd"?["tts-1-hd"]:pref==="mini"?["gpt-4o-mini-tts"]:[LS.get("jq_model","gpt-4o-mini-tts"),"tts-1-hd"];
  order=[...new Set(order)];
  let last=null;
  for(const model of order){
    for(let attempt=0;attempt<2;attempt++){
      let r;
      try{
        const body={model,voice:VOICE[who],input:text,response_format:"mp3"};
        if(model==="gpt-4o-mini-tts")body.instructions=instr(who,lv);
        else body.speed=+(LVSPEED[lv]*(S.set.slow?0.8:1)).toFixed(2);
        r=await fetch("https://api.openai.com/v1/audio/speech",{method:"POST",headers:{Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
      }catch(e){last=new Error("ネットワークエラー："+e.message);await sleep(600);continue}
      if(r.ok){const ab=await r.arrayBuffer();if(pref==="auto")LS.set("jq_model",model);await cset(k,ab);return ab}
      let msg="";try{const j=await r.json();msg=(j.error&&j.error.message)||""}catch(e){}
      if(r.status===401)throw new Error("OpenAI Key が正しくありません (401)。設定で入れ直してください");
      if(r.status===429){
        if(/quota|billing|credit/i.test(msg))throw new Error("OpenAI 餘額不足：請到 platform.openai.com/settings/organization/billing 充值");
        await sleep(1500*(attempt+1));last=new Error("リクエストが多すぎます (429)");continue;
      }
      last=new Error("TTS "+r.status+"："+(msg||"unknown"));
      break; // 換下一個模型
    }
  }
  throw last||new Error("TTS エラー");
}
const bufCache=new Map();
function decode(ab){const c=actx();return new Promise((res,rej)=>{const cp=ab.slice(0);const p=c.decodeAudioData(cp,res,rej);if(p&&p.catch)p.catch(rej)})}
async function getBuf(p,lv){const k=ckey(p.v,lv,p.t);if(bufCache.has(k))return bufCache.get(k);const ab=await ttsRequest(p.t,p.v,lv);const b=await decode(ab);bufCache.set(k,b);return b}
async function pool(items,limit,fn){const out=new Array(items.length);let i=0;async function w(){while(i<items.length){const n=i++;out[n]=await fn(items[n],n)}}await Promise.all(Array.from({length:Math.min(limit,items.length)},w));return out}

/* 把題目拆成「誰、說什麼、之後停多久」 */
function buildParts(q){
  const P=[],push=(v,t,gap)=>P.push({v,t,gap:gap==null?0.5:gap});
  const num=["いちばん","にばん","さんばん","よんばん"];
  const optsAudio=rv=>q.opts.forEach((o,i)=>{push("N",num[i],0.25);push(rv,o,1.0)});
  const lines=(lastGap)=>{(q.lines||[]).forEach(l=>push(l[0],l[1],0.5));if(P.length)P[P.length-1].gap=lastGap};
  if(q.type==="quick"){push(q.lines[0][0],q.lines[0][1],1.4);optsAudio(q.rv||"F")}
  else if(q.type==="task"||q.type==="point"){if(q.intro)push("N",q.intro,0.8);push("N",q.ask,1.8);lines(1.6);push("N",q.ask,0.3)}
  else if(q.type==="gist"){if(q.intro)push("N",q.intro,0.8);lines(1.3);push("N",q.ask,1.3);optsAudio("N")}
  else if(q.type==="utter"){push("N",q.ask,1.3);optsAudio(q.rv||"F")}
  else if(q.type==="integ"){if(q.intro)push("N",q.intro,0.8);lines(1.5);push("N",q.ask,0.3)}
  return P;
}
async function playParts(parts,lv,my,onStart){
  const ok=await ensureRunning();
  if(!ok)throw new Error("NEEDGESTURE");
  const bufs=await pool(parts,4,p=>getBuf(p,lv));
  if(my!==playToken)return false;
  const c=actx();
  if(c.state!=="running")throw new Error("NEEDGESTURE");
  onStart&&onStart();
  let t=c.currentTime+0.25;
  stopSrc();
  parts.forEach((p,i)=>{const s=c.createBufferSource();s.buffer=bufs[i];s.connect(c.destination);s.start(t);active.push(s);t+=bufs[i].duration+(i<parts.length-1?p.gap:0)});
  const end=t;
  while(my===playToken&&c.currentTime<end-0.05)await sleep(120);
  if(my!==playToken)return false;
  active=[];return true;
}

function prep(q){
  const idx=shuffle(q.opts.map((_,i)=>i));
  const qi=Object.assign({},q,{opts:idx.map(i=>q.opts[i]),ans:idx.indexOf(q.ans)});
  qi.parts=buildParts(qi);return qi;
}
function startRun(id,qs,hearts,title){
  if(!qs.length){toast("このステージにはまだ問題がありません");return}
  run={id,lv:id.split("-")[0],title,qs:qs.map(prep),i:0,hearts,max:hearts,correct:0,xp:0,streak:0,res:[],locked:false};
  if(!LEVELS[run.lv])run.lv=curLv;
  renderQuiz();
}
function startStage(id){
  const [lv,type]=id.split("-");
  if(type==="boss"){
    const pool_=shuffle(Q.filter(q=>q.lv===lv).slice()).slice(0,8);
    return startRun(id,pool_,4,lv+" 模擬試験");
  }
  startRun(id,shuffle(qsOf(lv,type).slice()),4,TYPES[type].jp);
}
function startReview(){
  const qs=S.wrong.map(id=>Q.find(q=>q.id===id)).filter(Boolean).slice(0,10);
  if(!qs.length){toast("復習する問題はありません 🎉");return}
  startRun("review",qs,5,"復習ノート");
}

async function askDict(mode,text,ctx){
  const key=mode+"|"+text+"|"+(mode==="w"?(ctx||"").slice(0,60):"");
  if(DICT[key])return DICT[key];
  if(!KEY)throw new Error("OpenAI Key が未設定です");
  const r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+KEY},
    body:JSON.stringify({model:"gpt-4o-mini",temperature:0.2,response_format:{type:"json_object"},messages:[{role:"system",content:DSYS},{role:"user",content:dPrompt(mode,text,ctx)}]})});
  if(!r.ok){
    let m="";try{m=(await r.json()).error.message}catch(e){}
    if(r.status===401)throw new Error("Key が無効です（401）");
    if(r.status===429)throw new Error(/quota|billing/i.test(m)?"クレジットが足りません":"リクエストが多すぎます。少し待ってください");
    throw new Error("エラー "+r.status+(m?"："+m.slice(0,80):""));
  }
  const j=await r.json();
  const d=JSON.parse(j.choices[0].message.content);
  DICT[key]=d;dictSave();return d;
}

function wsResult(w,ok){
  const x=S.wst[w];if(!x)return;
  if(ok){x.ok++;x.box=Math.min(5,x.box+1)}else{x.ng++;x.box=0}
  x.due=Date.now()+IVL[x.box]*DAY;x.t=Date.now();
}
const wsDue=()=>Object.values(S.wst).filter(x=>x.box<5&&x.due<=Date.now()).sort((a,b)=>(a.box-b.box)||((b.looks+b.ng)-(a.looks+a.ng))||(a.due-b.due));
function trainNote(qi){
  const t=(qi.targets||[]).map(w=>{const x=S.wst[w];if(!x)return "";const d=x.box>=5?"定着しました 🎉":"次は"+(x.box===0?"今日の後で":Math.round(IVL[x.box])+"日後")+"に再登場";return `「${esc(w)}」 ${strength(w)}（${d}）`}).filter(Boolean);
  return t.length?`<div class="tnote">🎓 先生メモ<br>${t.join("<br>")}</div>`:"";
}
function weakType(lv){
  const ts=LEVELS[lv].types.map(t=>{const s=S.tstat[lv+"|"+t]||{n:0,ok:0};return {t,n:s.n,acc:s.n?s.ok/s.n:1}});
  const seen=ts.filter(x=>x.n>=3).sort((a,b)=>a.acc-b.acc);
  if(seen.length&&seen[0].acc<0.85)return seen[0].t;
  const un=ts.slice().sort((a,b)=>a.n-b.n)[0];
  return un.n<3?un.t:null;
}
